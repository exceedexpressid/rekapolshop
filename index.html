    <!-- SCRIPT INISIALISASI PETA GLOBAL (AMAN dari Babel/React) -->
<script>
window.__initLokasiMap = function() {
    try {
        // Cek apakah Leaflet ada
        if (typeof L === 'undefined') {
            console.warn("Leaflet belum siap");
            setTimeout(window.__initLokasiMap, 200);
            return;
        }
        
        // Cek apakah ada data
        var data = window.__lokasiData;
        if (!data) return;
        
        // Cek container
        var container = document.getElementById('lokasi-map-container');
        if (!container) return;
        
        // Bersihkan container
        container.innerHTML = '';
        
        // Hapus instance lama jika ada
        if (window.__lokasiMapInstance) {
            try { window.__lokasiMapInstance.remove(); } catch(e) {}
            window.__lokasiMapInstance = null;
        }
        
        // Pastikan container punya tinggi
        if (container.offsetHeight < 50) {
            container.style.height = '400px';
        }
        
        // Buat peta
        var map = L.map('lokasi-map-container').setView([data.lat, data.lng], 15);
        window.__lokasiMapInstance = map;
        
        // Tambahkan tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
        
        // Custom marker
        var markerIcon = L.divIcon({
            className: '',
            html: '<div style="background:#06b6d4;width:36px;height:36px;border-radius:50%;border:3px solid white;box-shadow:0 3px 12px rgba(6,182,212,0.6);display:flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="color:white;font-size:16px;"></i></div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
        });
        
        var marker = L.marker([data.lat, data.lng], { icon: markerIcon }).addTo(map);
        
        // Popup
        var popupHtml = '<div style="min-width:180px;font-family:Inter,sans-serif;">' +
            '<div style="font-weight:800;color:#06b6d4;margin-bottom:6px;font-size:13px;border-bottom:1px solid #334155;padding-bottom:5px;">' +
            '<i class="fas fa-user-circle" style="margin-right:5px;"></i>' + data.name + '</div>' +
            '<div style="color:#94a3b8;font-size:11px;margin-bottom:3px;"><i class="fas fa-phone" style="margin-right:5px;"></i>' + data.phone + '</div>' +
            '<div style="color:#cbd5e1;font-size:11px;line-height:1.4;"><i class="fas fa-map-marker-alt" style="margin-right:5px;"></i>' + data.address + '</div>' +
            '<div style="color:#64748b;font-size:10px;border-top:1px solid #334155;padding-top:5px;margin-top:5px;"><i class="fas fa-store" style="margin-right:5px;"></i>' + data.olshop + '</div>' +
            '</div>';
        
        marker.bindPopup(popupHtml).openPopup();
        
        // Invalidate size setelah render
        setTimeout(function() {
            map.invalidateSize();
            marker.openPopup();
        }, 250);
        
        // Update state React via event custom
        var event = new CustomEvent('mapReady');
        document.dispatchEvent(event);
        
    } catch (e) {
        console.error("Gagal init peta:", e);
        var container = document.getElementById('lokasi-map-container');
        if (container) {
            container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ef4444;font-size:12px;padding:20px;text-align:center;flex-direction:column;"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><div>Gagal memuat peta: ' + e.message + '</div></div>';
        }
    }
};
</script>

<script type="text/babel" data-presets="env,react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, useRef, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Dashboard Crash:", error, errorInfo);
                this.setState({ errorInfo: error.toString() });
            }
            handleReset = () => {
                localStorage.clear();
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-app-dark flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                            <h1 className="text-2xl font-black text-white mb-2">Terjadi Kesalahan Sistem</h1>
                            <p className="text-slate-400 text-sm mb-6 max-w-md">Data di memori browser Anda mengalami kerusakan (corrupt). Silakan klik tombol di bawah untuk membersihkan memori dan memuat ulang aplikasi secara normal.</p>
                            <button onClick={this.handleReset} className="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center">
                                <i className="fas fa-sync-alt mr-2"></i> Bersihkan Memori & Muat Ulang
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const loadLocal = (key, fallback) => {
            try { 
                const item = localStorage.getItem(key); 
                return item ? JSON.parse(item) : fallback; 
            } catch (e) { 
                return fallback; 
            }
        };

        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };
        
        const formatCurrExcel = (amount) => {
            if (!amount && amount !== 0) return '-';
            if (amount === 0) return '0';
            return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(amount);
        };

        const StatusBadgeAdmin = ({ status }) => {
            const s = String(status || '').toLowerCase();
            if(s === 'sukses') return <span className="text-emerald-400 bg-emerald-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-emerald-800/50"><i className="fas fa-check-circle mr-1"></i>Sukses</span>;
            if(s === 'cancel' || s === 'batal') return <span className="text-red-400 bg-red-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-red-800/50"><i className="fas fa-times-circle mr-1"></i>Cancel</span>;
            if(s === 'pending') return <span className="text-orange-400 bg-orange-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-orange-800/50"><i className="fas fa-clock mr-1"></i>Pending</span>;
            return <span className="text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-blue-800/50"><i className="fas fa-truck mr-1"></i>Proses</span>;
        };

        function DashboardApp() {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVHojspm17WSZU42RaMtgiNWJikRfGyTlPh1FczlDJS9JL52PxX0d9RpkNJYM4g424/exec"; 
            const APPSHEET_APP_ID = "APLIKASEXCEED-327461285";

            const [layoutMode, setLayoutMode] = useState(() => loadLocal('exceed_layout_mode', 'web'));
            const [isLoadingSync, setIsLoadingSync] = useState(false);
            
            const [packages, setPackages] = useState(() => loadLocal('exceed_master_packages', []));
            const [masterOlshops, setMasterOlshops] = useState([]);
            const [masterZonas, setMasterZonas] = useState([]);
            const [masterKurirs, setMasterKurirs] = useState([]);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [globalStatusFilter, setGlobalStatusFilter] = useState('semua');
            
            const [activeTab, setActiveTab] = useState('olshop'); 
            
            // STATE UNTUK FITUR CEK LOKASI CUSTOMER
            const [lokasiSearchPhone, setLokasiSearchPhone] = useState('');
            const [lokasiSearchResult, setLokasiSearchResult] = useState(null);
            const [lokasiSearchStatus, setLokasiSearchStatus] = useState('idle'); // idle, searching, found, notfound, empty
            const [lokasiMapRef, setLokasiMapRef] = useState(null);
            const [mapInitialized, setMapInitialized] = useState(false);
            const [mapError, setMapError] = useState(null);
            const [showDebugInfo, setShowDebugInfo] = useState(false);
            
            const [expandedOlshops, setExpandedOlshops] = useState([]); 
            const [olshopFilters, setOlshopFilters] = useState({}); 
            const [expandedKurirs, setExpandedKurirs] = useState([]); 
            const [kurirFilters, setKurirFilters] = useState({}); 

            const [selectedImage, setSelectedImage] = useState(null);

            // KONFIGURASI KALKULATOR BAGI HASIL (SKEMA)
            const [simSettings, setSimSettings] = useState(() => loadLocal('exceed_sim_settings', {
                paketPerHari: 68, rataOngkir: 12200, hariKerja: 26
            }));

            // PERSENTASE SKEMA SESUAI DENGAN KETENTUAN BARU
            const skemaPct = {
                kurir: 75,
                kas: 5,
                ops: 10,
                kantor: 2,
                owner: 8
            };

            const handleSimChange = (field, value) => {
                const numValue = value === '' ? '' : Number(value);
                setSimSettings(prev => ({ ...prev, [field]: numValue }));
            };

            // STATE UNTUK CETAK LAPORAN
            const printAreaRef = useRef(null);
            const [rekapMode, setRekapMode] = useState('olshop');
            const [selectedValue, setSelectedValue] = useState('');
            const [searchNameText, setSearchNameText] = useState('');
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [cetakSearchQuery, setCetakSearchQuery] = useState('');
            const [cetakStartDate, setCetakStartDate] = useState('');
            const [cetakEndDate, setCetakEndDate] = useState('');

            useEffect(() => { localStorage.setItem('exceed_layout_mode', JSON.stringify(layoutMode)); }, [layoutMode]);
            useEffect(() => { localStorage.setItem('exceed_master_packages', JSON.stringify(packages)); }, [packages]);
            useEffect(() => { localStorage.setItem('exceed_sim_settings', JSON.stringify(simSettings)); }, [simSettings]);

            const toggleOlshop = (name) => setExpandedOlshops(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const toggleKurir = (name) => setExpandedKurirs(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);

            const getFinancials = (pkg) => {
                if(!pkg) return { hBarang:0, tagihan:0, oDasar:0, oTambahan:0, oTotal:0 };
                const hBarang = Number(pkg.hargaPaket) || 0;
                const tagihan = Number(pkg.totalTagihan) || 0;
                const selisihTagihan = tagihan - hBarang > 0 ? tagihan - hBarang : 0;
                
                let oTambahan = Number(pkg.tambahanOngkir) || 0;
                let oDasar = Number(pkg.ongkirDasar) || 0;
                
                if (oTambahan === 0 && oDasar > 0 && selisihTagihan > oDasar) oTambahan = selisihTagihan - oDasar;
                else if (oTambahan === 0 && oDasar === 0 && selisihTagihan > 0) oDasar = selisihTagihan;
                if (oDasar === 0 && oTambahan > 0 && selisihTagihan > oTambahan) oDasar = selisihTagihan - oTambahan;

                return { hBarang, tagihan, oDasar: Math.max(0, oDasar), oTambahan, oTotal: Math.max(0, oDasar) + oTambahan };
            };

            const getFotoUrl = (pkg) => {
                if(!pkg) return null;
                const fileKey = pkg.fotoBukti || pkg.foto_bukti || pkg.foto || pkg.bukti || pkg.gambar;
                if (!fileKey || String(fileKey).trim() === '') return null;
                if (String(fileKey).startsWith('http://') || String(fileKey).startsWith('https://')) return fileKey;
                return `https://www.appsheet.com/template/gettablefileurl?appName=${APPSHEET_APP_ID}&tableName=InputPaket&fileName=${encodeURIComponent(fileKey)}`;
            };

            const syncData = async () => {
                setIsLoadingSync(true);
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getInitData&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setPackages(result.data.packages || []);
                        setMasterOlshops(result.data.olshop || []);
                        setMasterZonas(result.data.zona || []);
                        setMasterKurirs(result.data.kurir || []);
                    } else {
                        console.error('Gagal memuat data dari server.');
                    }
                } catch (error) {
                    console.error('Koneksi terputus. Cek internet Anda.');
                } finally {
                    setIsLoadingSync(false);
                }
            };

            useEffect(() => {
                syncData();
            }, []);

            // ==========================================
            // LOGIKA FILTER DAN AKUNTANSI GLOBAL
            // ==========================================
            const { filteredPkgs, olshopReport, kurirReport, globalSummary } = useMemo(() => {
                let pkgs = packages || [];
                
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    pkgs = pkgs.filter(p => String(p.customerName || '').toLowerCase().includes(q) || String(p.packageId || '').toLowerCase().includes(q) || String(p.olshopName || '').toLowerCase().includes(q) || String(p.kurirId || '').toLowerCase().includes(q));
                }
                
                if (startDate || endDate) {
                   pkgs = pkgs.filter(p => {
                      let pDateStr = p.dateString || p.tanggal || '';
                      if (!pDateStr) return false;
                      let normalizedDateStr = "";
                      try {
                          let d = new Date(pDateStr);
                          if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                              const parts = pDateStr.split('/');
                              if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                          }
                          if (!isNaN(d.getTime())) {
                              const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                              normalizedDateStr = `${year}-${month}-${day}`;
                          } else { normalizedDateStr = pDateStr.split('T')[0]; }
                      } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                      
                      const sDate = startDate ? startDate : "2000-01-01";
                      const eDate = endDate ? endDate : "2100-01-01";
                      return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                   });
                }
                
                let totalPkt = 0, totalSks = 0, totalPrs = 0, totalPnd = 0, totalCnc = 0;
                pkgs.forEach(p => {
                    if(!p) return;
                    totalPkt++;
                    let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                    if (stat === 'sukses') totalSks++;
                    else if (stat === 'cancel' || stat === 'batal') totalCnc++;
                    else if (stat === 'pending') totalPnd++;
                    else totalPrs++;
                });

                if (globalStatusFilter !== 'semua') {
                    pkgs = pkgs.filter(p => {
                        let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                        if (globalStatusFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                        if (globalStatusFilter === 'cancel') return stat === 'cancel' || stat === 'batal';
                        return stat === globalStatusFilter;
                    });
                }

                const oReport = {}; const kReport = {};
                const summary = { 
                    totalPencairanOlshop: 0, totalDanaBelumCair: 0, totalDanaCair: 0, 
                    totalSetoranKurir: 0, totalPaketSukses: 0, totalOngkirTambahanKurir: 0, 
                    totalProfitPerusahaan: 0, 
                    totalPkt, totalSks, totalPrs, totalPnd, totalCnc
                };

                pkgs.forEach(pkg => {
                    if(!pkg) return;
                    const statusPkg = String(pkg.status || '').toLowerCase().trim().replace(' ', '_');
                    const olshopName = String(pkg.olshopName || 'Tanpa Nama').toUpperCase();
                    const kurirName = String(pkg.kurirId || 'Tanpa Kurir').split('@')[0].toUpperCase();
                    const metode = String(pkg.metodeBayar || '').trim().toUpperCase();
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (!oReport[olshopName]) oReport[olshopName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, pencairan: 0, potongan: 0, potonganDasar: 0, potonganTambahan: 0, totalDasar: 0, totalTambahan: 0, nilaiBarang: 0, nominalBelumCair: 0, paketBelumCairIds: [], paketBelumCairDetails: [], paketTerkait: [] };
                    if (!kReport[kurirName]) kReport[kurirName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, setoran: 0, rincianCash: 0, rincianMinusTf: 0, totalTfOlshop: 0, totalTfKantor: 0, totalTambahanOngkir: 0, tambahanOngkirCash: 0, tambahanOngkirTF: 0, paketTerkait: [], totalDasarOngkir: 0, profitPerusahaan: 0 };
                    
                    oReport[olshopName].paketTerkait.push(pkg);
                    kReport[kurirName].paketTerkait.push(pkg);

                    if (statusPkg === 'sukses') {
                        oReport[olshopName].totalSukses += 1;
                        kReport[kurirName].totalSukses += 1;
                        summary.totalPaketSukses += 1;
                        summary.totalOngkirTambahanKurir += oTambahan; 
                        summary.totalProfitPerusahaan += oDasar; 
                        
                        oReport[olshopName].totalDasar += oDasar;
                        oReport[olshopName].totalTambahan += oTambahan;
                        
                        kReport[kurirName].totalTambahanOngkir += oTambahan;
                        kReport[kurirName].totalDasarOngkir += oDasar;
                        kReport[kurirName].profitPerusahaan += oDasar; 

                        const isCair = String(pkg.statusPencairan || '').toLowerCase() === 'cair';

                        let pencairan = 0; let potongan = 0;
                        if (metode === 'TF OLSHOP') { potongan = oTotal; oReport[olshopName].potonganDasar += oDasar; oReport[olshopName].potonganTambahan += oTambahan; pencairan = -oTotal; } 
                        else if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') { pencairan = hBarang; }

                        oReport[olshopName].pencairan += pencairan;
                        if (metode === 'TF OLSHOP') oReport[olshopName].potongan += oTotal;
                        if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') oReport[olshopName].nilaiBarang += hBarang;
                        summary.totalPencairanOlshop += pencairan;

                        if (!isCair) {
                            oReport[olshopName].nominalBelumCair += pencairan;
                            oReport[olshopName].paketBelumCairIds.push(pkg.packageId); 
                            oReport[olshopName].paketBelumCairDetails.push(pkg);
                            summary.totalDanaBelumCair += pencairan;
                        } else { summary.totalDanaCair += pencairan; }

                        let setoranKurir = 0;
                        if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') {
                            if (metode === 'TF OLSHOP') kReport[kurirName].totalTfOlshop += hBarang;
                            if (metode === 'TF KANTOR') kReport[kurirName].totalTfKantor += hBarang;
                            kReport[kurirName].rincianMinusTf += oTotal;
                            kReport[kurirName].tambahanOngkirTF += oTambahan; 
                            setoranKurir = -oTambahan; 
                        } else if (metode === 'CASH' || metode === 'COD') {
                            const cashDiterima = hBarang + oDasar + oTambahan; 
                            kReport[kurirName].rincianCash += cashDiterima;
                            kReport[kurirName].tambahanOngkirCash += oTambahan; 
                            setoranKurir = hBarang + oDasar; 
                        }
                        kReport[kurirName].setoran += setoranKurir;
                        summary.totalSetoranKurir += setoranKurir;

                    } else if (statusPkg === 'cancel' || statusPkg === 'batal') { oReport[olshopName].totalCancel += 1; kReport[kurirName].totalCancel += 1; } 
                    else if (statusPkg === 'pending') { oReport[olshopName].totalPending += 1; kReport[kurirName].totalPending += 1; } 
                    else { oReport[olshopName].totalProses += 1; kReport[kurirName].totalProses += 1; }
                });

                const activeOReport = Object.keys(oReport).filter(k => oReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = oReport[key]; return obj; }, {});
                const activeKReport = Object.keys(kReport).filter(k => kReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = kReport[key]; return obj; }, {});

                const sortedOlshop = Object.keys(activeOReport).map(k => ({ name: k, ...activeOReport[k] })).sort((a, b) => b.pencairan - a.pencairan);
                const sortedKurir = Object.keys(activeKReport).map(k => ({ name: k, ...activeKReport[k] })).sort((a, b) => b.setoran - a.setoran);

                return { filteredPkgs: pkgs, olshopReport: sortedOlshop, kurirReport: sortedKurir, globalSummary: summary };
            }, [packages, startDate, endDate, globalStatusFilter, searchQuery]);


            // ==========================================
            // LOGIKA CETAK LAPORAN
            // ==========================================
            const { cetakFilteredData, cetakSummary } = useMemo(() => {
                let filtered = packages;
                
                if (selectedValue) {
                    if (rekapMode === 'olshop') {
                        filtered = filtered.filter(p => String(p.olshopName).trim().toUpperCase() === selectedValue);
                    } else {
                        filtered = filtered.filter(p => String(p.kurirId || '').split('@')[0].trim().toUpperCase() === selectedValue);
                    }
                } else { filtered = []; }

                if (cetakSearchQuery) {
                    const q = cetakSearchQuery.toLowerCase();
                    filtered = filtered.filter(p => 
                        String(p.customerName).toLowerCase().includes(q) || 
                        String(p.packageId || '').toLowerCase().includes(q) ||
                        String(p.address || '').toLowerCase().includes(q)
                    );
                }

                if (cetakStartDate || cetakEndDate) {
                    filtered = filtered.filter(p => {
                        let pDateStr = p.dateString || p.tanggal || '';
                        if (!pDateStr) return false;
                        let normalizedDateStr = "";
                        try {
                            let d = new Date(pDateStr);
                            if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                                const parts = pDateStr.split('/');
                                if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                            }
                            if (!isNaN(d.getTime())) {
                                const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                                normalizedDateStr = `${year}-${month}-${day}`;
                            } else { normalizedDateStr = pDateStr.split('T')[0]; }
                        } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                        
                        const sDate = cetakStartDate ? cetakStartDate : "2000-01-01";
                        const eDate = cetakEndDate ? cetakEndDate : "2100-01-01";
                        return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                    });
                }

                let s_sukses = 0, s_pending = 0, s_cancel = 0;
                let setoran = 0, tfVolume = 0, sudahSetor = 0; 

                filtered.forEach(pkg => {
                    const stat = String(pkg.status).toLowerCase().replace(' ', '_');
                    const metode = String(pkg.metodeBayar).trim().toUpperCase();
                    const isCair = String(pkg.statusPencairan).toLowerCase() === 'cair';
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (stat === 'sukses') {
                        s_sukses++;
                        let currentSetoran = 0; let currentTfVolume = 0;
                        if (rekapMode === 'olshop') {
                            if (metode === 'CASH' || metode === 'COD' || metode === 'TF KANTOR') currentSetoran = hBarang;
                            if (metode === 'TF OLSHOP') currentTfVolume = oTotal;
                        } else {
                            if (metode === 'CASH' || metode === 'COD') currentSetoran = hBarang + oDasar;
                            if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') currentTfVolume = oTambahan;
                        }
                        setoran += currentSetoran;
                        tfVolume += currentTfVolume;
                        if (isCair) sudahSetor += (currentSetoran - currentTfVolume);
                    } else if (stat === 'pending' || stat === 'siap_antar' || stat === 'proses') { s_pending++; } 
                    else if (stat === 'cancel' || stat === 'batal') { s_cancel++; }
                });

                const estimasiSetoran = setoran - tfVolume;
                return { cetakFilteredData: filtered, cetakSummary: { sukses: s_sukses, pending: s_pending, cancel: s_cancel, setoran, tfVolume, estimasiSetoran, sudahSetor } };
            }, [packages, rekapMode, selectedValue, cetakSearchQuery, cetakStartDate, cetakEndDate]);

            const olshopListCetak = useMemo(() => [...new Set(packages.map(p => String(p.olshopName).trim().toUpperCase()))].filter(Boolean).sort(), [packages]);
            const kurirListCetak = useMemo(() => [...new Set(packages.map(p => String(p.kurirId || '').split('@')[0].trim().toUpperCase()))].filter(Boolean).sort(), [packages]);

            const getIndoDate = (dateStr) => {
                if(!dateStr) return '-';
                try {
                    const d = new Date(dateStr);
                    const months = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
                    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
                } catch(e) { return dateStr; }
            };

            const displayHeaderDate = () => {
                if (cetakStartDate && cetakEndDate) {
                    if (cetakStartDate === cetakEndDate) return getIndoDate(cetakStartDate);
                    return `${getIndoDate(cetakStartDate)} - ${getIndoDate(cetakEndDate)}`;
                } else if (cetakStartDate) return `Sejak ${getIndoDate(cetakStartDate)}`;
                else if (cetakEndDate) return `Hingga ${getIndoDate(cetakEndDate)}`;
                return 'Semua Waktu';
            };

            const executeExport = async (format) => {
                if (!printAreaRef.current) return;
                const loadingEl = document.getElementById('export-loading');
                loadingEl.style.display = 'flex'; 
                const currentScrollY = window.scrollY;
                window.scrollTo(0, 0);

                setTimeout(async () => {
                    try {
                        const element = printAreaRef.current;
                        const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: element.scrollWidth, windowHeight: element.scrollHeight });
                        window.scrollTo(0, currentScrollY);
                        const imgData = canvas.toDataURL('image/jpeg', 1.0);
                        const safeFileNameDate = (cetakStartDate === cetakEndDate && cetakStartDate) ? cetakStartDate : 'Rentang_Waktu';
                        const fileName = `Rekap_${rekapMode.toUpperCase()}_${selectedValue.replace(/\s+/g, '_')}_${safeFileNameDate}`;

                        if (format === 'jpg') {
                            const link = document.createElement('a'); link.href = imgData; link.download = `${fileName}.jpg`; link.click();
                        } else if (format === 'pdf') {
                            const { jsPDF } = window.jspdf;
                            const pdf = new jsPDF('l', 'mm', 'a4');
                            const pdfWidth = pdf.internal.pageSize.getWidth();
                            const pdfHeight = pdf.internal.pageSize.getHeight();
                            const imgWidth = pdfWidth - 20; 
                            const imgHeight = (canvas.height * imgWidth) / canvas.width; 
                            
                            let heightLeft = imgHeight; let position = 10; 
                            pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight);
                            heightLeft -= (pdfHeight - 20); 
                            
                            while (heightLeft > 0) {
                                position = position - pdfHeight; pdf.addPage();
                                pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight);
                                heightLeft -= pdfHeight;
                            }
                            pdf.save(`${fileName}.pdf`);
                        }
                    } catch (err) { alert("Terjadi kesalahan saat mengekstrak. Coba lagi."); } 
                    finally { loadingEl.style.display = 'none'; }
                }, 800); 
            };


            const isAndroid = layoutMode === 'android';

            const renderDashboardHeader = () => (
                <header className="bg-app-header px-4 py-3 shadow-md z-20 sticky top-0 flex justify-between items-center border-b border-app-border shrink-0">

                        <div className="w-8 h-8 md:w-10 md:h-10 bg-emerald-600 rounded-lg flex items-center justify-center mr-3 text-white shadow-sm">
                            <i className="fas fa-crown text-sm md:text-base"></i>
                        </div>
                        <div>
                            <p className="text-[9px] md:text-[10px] text-emerald-400 font-bold uppercase tracking-widest mb-0.5">EXCEED EXPRESS</p>
                            <h1 className="text-sm md:text-lg lg:text-xl font-black text-white leading-none truncate">DASHBOARD KURIR</h1>
                        </div>
                    </div>
                    <div className="flex items-center gap-2 md:gap-4">
                        <div className="flex bg-[#0b1120] rounded-lg p-1 border border-app-border items-center">
                            <button onClick={() => setLayoutMode('android')} className={`px-2 py-1 rounded-md text-[10px] md:text-xs font-bold flex items-center transition-colors ${isAndroid ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                <i className="fas fa-mobile-alt md:mr-1.5"></i> <span className="hidden md:inline">Mobile</span>
                            </button>
                            <button onClick={() => setLayoutMode('web')} className={`px-2 py-1 rounded-md text-[10px] md:text-xs font-bold flex items-center transition-colors ${!isAndroid ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                <i className="fas fa-desktop md:mr-1.5"></i> <span className="hidden md:inline">Desktop</span>
                            </button>
                        </div>
                    </div>
                </header>
            );

            const renderFilterSection = () => (
                <div className={`bg-app-card border border-app-border rounded-xl p-3 md:p-4 flex ${isAndroid ? 'flex-col space-y-3' : 'flex-col lg:flex-row lg:space-y-0 lg:space-x-4 lg:items-center'}`}>
                    <div className={`relative w-full ${!isAndroid ? 'lg:flex-1' : ''}`}>
                        <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" placeholder="Cari Resi, Customer, Olshop..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-3 py-2.5 bg-app-header border border-app-border rounded-lg text-xs outline-none focus:border-emerald-500 text-slate-200 placeholder-slate-500 transition-colors" />
                    </div>
                    
                    <div className={`flex items-center space-x-2 w-full ${!isAndroid ? 'lg:w-auto shrink-0' : ''}`}>
                        <div className="relative flex-1 lg:w-36">
                            <i className="fas fa-calendar absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full pl-9 pr-2 py-2 bg-app-header border border-app-border rounded-lg text-xs outline-none focus:border-emerald-500 text-slate-200" />
                        </div>
                        <span className="text-[10px] md:text-xs font-bold text-slate-400">s/d</span>
                        <div className="relative flex-1 lg:w-36">
                            <i className="fas fa-calendar absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full pl-9 pr-2 py-2 bg-app-header border border-app-border rounded-lg text-xs outline-none focus:border-emerald-500 text-slate-200" />
                        </div>
                        {(startDate || endDate) && (<button onClick={() => { setStartDate(''); setEndDate(''); }} className="px-3 py-2 bg-[#2a3042] text-red-400 rounded-lg hover:bg-slate-600 flex justify-center items-center"><i className="fas fa-times-circle"></i></button>)}
                    </div>
                    
                    <div className={`flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-hide w-full pt-1 ${!isAndroid ? 'lg:pt-0 lg:w-auto shrink-0' : ''}`}>
                        <span className="text-slate-400 text-[10px] md:text-xs font-bold flex items-center mr-1 flex-shrink-0"><i className="fas fa-filter mr-1.5"></i> Status:</span>
                        {[{id:'semua', label:'SEMUA'}, {id:'sukses', label:'SUKSES'}, {id:'proses', label:'PROSES'}, {id:'pending', label:'PENDING'}, {id:'cancel', label:'CANCEL'}].map(f => (
                            <button key={f.id} onClick={() => setGlobalStatusFilter(f.id)} className={`px-3 py-1.5 rounded text-[9px] md:text-[10px] font-bold uppercase transition-colors whitespace-nowrap ${globalStatusFilter === f.id ? 'bg-[#10b981] text-white border border-[#10b981]' : 'bg-transparent text-slate-400 border border-app-border hover:bg-app-border'}`}>
                                {f.label}
                            </button>
                        ))}
                    </div>

                    <button onClick={() => syncData()} disabled={isLoadingSync} className={`flex items-center justify-center bg-[#1e7e59] hover:bg-emerald-600 py-2.5 px-4 rounded-lg transition-all mt-1 ${isAndroid ? 'w-full' : 'lg:mt-0 lg:w-auto shrink-0'} ${isLoadingSync ? 'opacity-50 cursor-not-allowed' : ''}`}>
                        <i className={`fas fa-sync-alt text-white mr-2 text-xs ${isLoadingSync ? 'animate-spin' : ''}`}></i>
                        <span className="text-white text-[10px] md:text-xs font-bold tracking-wider">{isLoadingSync ? 'MEMUAT...' : 'REFRESH'}</span>
                    </button>
                </div>
            );

            const renderStatusSummaryBar = () => (
                <div className="grid grid-cols-2 lg:grid-cols-5 gap-2 md:gap-3 animate-fade-in">
                    <div className="col-span-2 lg:col-span-1 bg-app-card border border-app-border rounded-xl p-3 flex flex-col items-center justify-center shadow-sm">

                        <span className="text-[10px] text-emerald-500/70 font-bold uppercase tracking-widest mb-1">Sukses</span>

                        <span className="text-lg md:text-xl font-black text-red-400">{globalSummary.totalCnc}</span>
                    </div>
                </div>
            );

            const renderMetricCards = () => (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 animate-fade-in">
                    <div className="bg-[#2a4dcc] rounded-xl p-5 md:p-6 text-white shadow-lg relative overflow-hidden border border-[#3b5edd]">
                        <div className="absolute -right-4 -bottom-6 opacity-20"><i className="fas fa-motorcycle text-[100px]"></i></div>
                        <p className="text-blue-200 text-[10px] md:text-xs font-bold uppercase tracking-widest mb-1.5 relative z-10">TOTAL UANG DI KURIR</p>
                        <h2 className="text-2xl md:text-4xl font-black mb-3 relative z-10 tracking-tight">{formatCurrency(globalSummary.totalSetoranKurir)}</h2>
                        <div className="inline-flex text-[9px] md:text-[10px] text-blue-100 items-center bg-blue-900/40 border border-blue-500/30 px-2.5 py-1.5 rounded-lg relative z-10 backdrop-blur-sm font-bold">
                            <i className="fas fa-hand-holding-usd mr-2 text-blue-300"></i> Tunai wajib setor
                        </div>
                    </div>
                    <div className="bg-[#d9531e] rounded-xl p-5 md:p-6 text-white shadow-lg relative overflow-hidden border border-[#e66a35]">
                        <div className="absolute -right-4 -bottom-6 opacity-20"><i className="fas fa-store text-[100px]"></i></div>
                        <p className="text-orange-200 text-[10px] md:text-xs font-bold uppercase tracking-widest mb-1.5 relative z-10">DANA OLSHOP (BLM CAIR)</p>

                        </div>

            );

            const renderWebSidebar = () => (
                <div className="w-64 bg-app-card border-r border-app-border flex flex-col shrink-0 h-full overflow-y-auto">
                    <div className="p-4">
                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Menu Laporan</p>
                        <nav className="space-y-1.5">
                            <button onClick={() => setActiveTab('olshop')} className={`w-full flex items-center px-4 py-3 rounded-lg text-sm font-bold transition-all ${activeTab === 'olshop' ? 'bg-[#d9531e]/10 text-[#d9531e] border border-[#d9531e]/30' : 'text-slate-400 hover:bg-app-border hover:text-slate-200 border border-transparent'}`}>
                                <i className="fas fa-store w-6 text-center mr-2"></i> Rekap Olshop
                            </button>
                            <button onClick={() => setActiveTab('kurir')} className={`w-full flex items-center px-4 py-3 rounded-lg text-sm font-bold transition-all ${activeTab === 'kurir' ? 'bg-[#3b82f6]/10 text-[#3b82f6] border border-[#3b82f6]/30' : 'text-slate-400 hover:bg-app-border hover:text-slate-200 border border-transparent'}`}>
                                <i className="fas fa-motorcycle w-6 text-center mr-2"></i> Rekap Setoran Kurir
                            </button>
                            <button onClick={() => setActiveTab('profit')} className={`w-full flex items-center px-4 py-3 rounded-lg text-sm font-bold transition-all ${activeTab === 'profit' ? 'bg-[#10b981]/10 text-[#10b981] border border-[#10b981]/30' : 'text-slate-400 hover:bg-app-border hover:text-slate-200 border border-transparent'}`}>
                                <i className="fas fa-chart-line w-6 text-center mr-2"></i> Rincian Pendapatan
                            </button>
                            <button onClick={() => setActiveTab('skema')} className={`w-full flex items-center px-4 py-3 rounded-lg text-sm font-bold transition-all ${activeTab === 'skema' ? 'bg-[#eab308]/10 text-[#eab308] border border-[#eab308]/30' : 'text-slate-400 hover:bg-app-border hover:text-slate-200 border border-transparent'}`}>
                                <i className="fas fa-chart-pie w-6 text-center mr-2"></i> Kalkulator Bagi Hasil
                            </button>
                            <button onClick={() => setActiveTab('cetak')} className={`w-full flex items-center px-4 py-3 rounded-lg text-sm font-bold transition-all ${activeTab === 'cetak' ? 'bg-orange-500/10 text-orange-500 border border-orange-500/30' : 'text-slate-400 hover:bg-app-border hover:text-slate-200 border border-transparent'}`}>
                                <i className="fas fa-print w-6 text-center mr-2"></i> Cetak Laporan

            const renderMenuGrid = () => (

                        <button onClick={() => setActiveTab('olshop')} className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${activeTab === 'olshop' ? 'bg-[#d9531e]/10 border-[#d9531e] shadow-[0_0_15px_rgba(217,83,30,0.15)]' : 'bg-app-card border-app-border hover:bg-app-border'}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'olshop' ? 'bg-[#d9531e] text-white' : 'bg-[#151928] text-[#d9531e] border border-app-border'}`}><i className="fas fa-store text-base"></i></div>

                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'kurir' ? 'bg-blue-500 text-white' : 'bg-[#151928] text-blue-400 border border-app-border'}`}><i className="fas fa-motorcycle text-base"></i></div>

                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'profit' ? 'bg-emerald-500 text-white' : 'bg-[#151928] text-emerald-400 border border-app-border'}`}><i className="fas fa-chart-line text-base"></i></div>
                            <span className={`text-[8px] text-center font-black uppercase ${activeTab === 'profit' ? 'text-white' : 'text-slate-300'}`}>Pendapatan</span>

                        <button onClick={() => setActiveTab('skema')} className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${activeTab === 'skema' ? 'bg-yellow-500/10 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.15)]' : 'bg-app-card border-app-border hover:bg-app-border'}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'skema' ? 'bg-yellow-500 text-white' : 'bg-[#151928] text-yellow-400 border border-app-border'}`}><i className="fas fa-chart-pie text-base"></i></div>
                            <span className={`text-[8px] text-center font-black uppercase ${activeTab === 'skema' ? 'text-white' : 'text-slate-300'}`}>Kalkulator</span>
                        </button>
                        <button onClick={() => setActiveTab('cetak')} className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${activeTab === 'cetak' ? 'bg-orange-500/10 border-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.15)]' : 'bg-app-card border-app-border hover:bg-app-border'}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'cetak' ? 'bg-orange-500 text-white' : 'bg-[#151928] text-orange-400 border border-app-border'}`}><i className="fas fa-print text-base"></i></div>
                            <span className={`text-[8px] text-center font-black uppercase ${activeTab === 'cetak' ? 'text-white' : 'text-slate-300'}`}>Cetak</span>
                        </button>
                        <button onClick={() => setActiveTab('lokasi')} className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${activeTab === 'lokasi' ? 'bg-cyan-500/10 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.15)]' : 'bg-app-card border-app-border hover:bg-app-border'}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-1.5 shadow-inner ${activeTab === 'lokasi' ? 'bg-cyan-500 text-white' : 'bg-[#151928] text-cyan-400 border border-app-border'}`}><i className="fas fa-map-marker-alt text-base"></i></div>
                            <span className={`text-[8px] text-center font-black uppercase ${activeTab === 'lokasi' ? 'text-white' : 'text-slate-300'}`}>Lokasi</span>
                        </button>
                    </div>
                </div>
            );

            // ==========================================
            // FUNGSI BANTU: NORMALISASI NOMOR HP
            // ==========================================
            const normalizePhone = (phoneStr) => {
                if (!phoneStr) return '';
                let result = String(phoneStr).trim();
                // Hapus semua karakter non-angka: spasi, tanda hubung, titik, kurung, dll
                result = result.replace(/[^0-9]/g, '');
                // Ubah awalan +62 atau 62 menjadi 0
                if (result.startsWith('62')) result = '0' + result.substring(2);
                // Hapus awalan 0 berlebih (misal: 0081 -> 081)
                while (result.length > 1 && result.startsWith('00')) {
                    result = result.substring(1);
                }
                return result;
            };

            // ==========================================
            // FUNGSI BANTU: PARSE NILAI KOORDINAT
            // Menangani berbagai format: angka, string dengan petik, string kosong, dll
            // ==========================================
            const parseCoordinate = (value) => {
                if (value === null || value === undefined) return null;
                let strVal = String(value).trim();
                // Hapus petik tunggal di awal (format teks di spreadsheet: '0)
                strVal = strVal.replace(/^['"]/, '');
                // Jika kosong atau hanya berisi 0 saja (tanpa desimal), anggap tidak valid
                if (!strVal || strVal === '' || strVal === '0') return null;
                // Coba parse ke angka
                const num = parseFloat(strVal);
                // Cek apakah angka valid dan masuk rentang koordinat yang masuk akal
                if (!isNaN(num) && isFinite(num) && num !== 0) {
                    return num;
                }
                return null;
            };

            // ==========================================
            // FUNGSI BANTU: CEK APAKAH PAKET PUNYA DATA LOKASI
            // Mencoba berbagai kemungkinan nama kolom
            // ==========================================
            const extractLocation = (pkg) => {
                if (!pkg) return { lat: null, lng: null, latSource: null, lngSource: null };
                
                // Daftar kemungkinan nama kolom latitude
                const latFields = ['latitude', 'lat', 'LAT', 'Latitude', 'LATITUDE', 'latittude', 'koordinat_lat', 'titik_lat', 'maps_lat', 'gps_lat'];
                // Daftar kemungkinan nama kolom longitude
                const lngFields = ['longitude', 'lng', 'lon', 'LON', 'LNG', 'Longitude', 'LONGITUDE', 'longtitude', 'koordinat_lng', 'koordinat_lon', 'titik_lng', 'titik_lon', 'maps_lng', 'maps_lon', 'gps_lng', 'gps_lon'];
                // Daftar kemungkinan nama kolom koordinat GABUNGAN
                const gpsFields = ['koordinatGps', 'koordinat_gps', 'koordinat', 'gps', 'titikLokasi', 'titik_lokasi', 'lokasi', 'koordinatGPS', 'KoordinatGps'];
                
                let lat = null, lng = null, latSource = null, lngSource = null;
                
                // PRIORITAS 1: Cari kolom latitude & longitude TERSEPISAH
                for (const field of latFields) {
                    if (pkg[field] !== undefined && pkg[field] !== null && pkg[field] !== '') {
                        const parsed = parseCoordinate(pkg[field]);
                        if (parsed !== null) {
                            lat = parsed;
                            latSource = field;
                            break;
                        }
                    }
                }
                
                for (const field of lngFields) {
                    if (pkg[field] !== undefined && pkg[field] !== null && pkg[field] !== '') {
                        const parsed = parseCoordinate(pkg[field]);
                        if (parsed !== null) {
                            lng = parsed;
                            lngSource = field;
                            break;
                        }
                    }
                }
                
                // Jika sudah dapat keduanya dari kolom terpisah, langsung return
                if (lat !== null && lng !== null) {
                    return { lat, lng, latSource, lngSource };
                }
                
                // ⭐ PRIORITAS 2: Coba PARSE dari kolom koordinat GABUNGAN (contoh: "-2.612043, 140.677319")
                for (const field of gpsFields) {
                    if (pkg[field] !== undefined && pkg[field] !== null && pkg[field] !== '') {
                        const rawVal = String(pkg[field]).trim().replace(/^['"]/, '');
                        if (!rawVal || rawVal === '0' || rawVal === '-') continue;
                        
                        // Pisahkan dengan koma, spasi, atau titik koma
                        const parts = rawVal.split(/[,;\s]+/).filter(p => p.trim() !== '');
                        if (parts.length >= 2) {
                            const latNum = parseFloat(parts[0]);
                            const lngNum = parseFloat(parts[1]);
                            if (!isNaN(latNum) && !isNaN(lngNum) && latNum !== 0 && lngNum !== 0) {
                                return { 
                                    lat: latNum, 
                                    lng: lngNum, 
                                    latSource: field + ' (parsed)', 
                                    lngSource: field + ' (parsed)' 
                                };
                            }
                        }
                    }
                }
                
                return { lat: null, lng: null, latSource: null, lngSource: null };
            };

            // ==========================================
            // FUNGSI UTAMA: CEK LOKASI CUSTOMER BERDASARKAN NO HP
            // ==========================================
            const handleLokasiSearch = () => {
                try {
                    const phone = lokasiSearchPhone.trim();
                    if (!phone) {
                        setLokasiSearchStatus('idle');
                        setLokasiSearchResult(null);
                        setMapInitialized(false);
                        setMapError(null);
                        try {
                            if (lokasiMapRef) { lokasiMapRef.remove(); }
                        } catch(e) {}
                        setLokasiMapRef(null);
                        window.__lokasiData = null;
                        return;
                    }
                    
                    // Reset semua state
                    setMapInitialized(false);
                    setMapError(null);
                    try {
                        if (lokasiMapRef) { lokasiMapRef.remove(); }
                    } catch(e) {}
                    setLokasiMapRef(null);
                    window.__lokasiData = null;
                    
                    setLokasiSearchStatus('searching');
                
                // Normalisasi nomor HP input
                const normalizedInput = normalizePhone(phone);
                
                setTimeout(() => {
                    // Cari customer dengan pencocokan yang FLEKSIBEL
                    const found = packages.filter(pkg => {
                        const pkgPhone = String(pkg.customerPhone || pkg.noHp || pkg.nohp || pkg.phone || pkg.hp || '').trim();
                        const normalizedPkg = normalizePhone(pkgPhone);
                        
                        // Strategi pencocokan:
                        // 1. Cocok persis setelah normalisasi
                        // 2. Input merupakan bagian dari nomor paket
                        // 3. Nomor paket merupakan bagian dari input
                        // 4. Cocokkan 6 digit terakhir
                        if (!normalizedInput && !normalizedPkg) return false;
                        
                        if (normalizedPkg === normalizedInput) return true;
                        if (normalizedInput.length >= 4 && normalizedPkg.includes(normalizedInput)) return true;
                        if (normalizedPkg.length >= 4 && normalizedInput.includes(normalizedPkg)) return true;
                        if (normalizedInput.length >= 6 && normalizedPkg.length >= 6) {
                            if (normalizedInput.slice(-6) === normalizedPkg.slice(-6)) return true;
                        }
                        // Pencocokan longgar (tanpa normalisasi) untuk berjaga-jaga
                        if (pkgPhone && phone && pkgPhone.includes(phone)) return true;
                        
                        return false;
                    });
                    
                    if (found.length === 0) {
                        setLokasiSearchStatus('notfound');
                        setLokasiSearchResult(null);
                    } else {
                        // Urutkan berdasarkan tanggal terbaru (jika ada field tanggal)
                        const sorted = [...found].sort((a, b) => {
                            const dateA = new Date(a.dateString || a.tanggal || 0).getTime();
                            const dateB = new Date(b.dateString || b.tanggal || 0).getTime();
                            return dateB - dateA;
                        });
                        
                        const latestPkg = sorted[0];
                        const location = extractLocation(latestPkg);
                        
                        // Cek apakah ADA paket dari customer ini yang punya koordinat
                        let anyPackageHasLocation = false;
                        let packageWithLocation = null;
                        for (const pkg of sorted) {
                            const loc = extractLocation(pkg);
                            if (loc.lat !== null && loc.lng !== null) {
                                anyPackageHasLocation = true;
                                packageWithLocation = pkg;
                                break;
                            }
                        }
                        
                        const usePkg = packageWithLocation || latestPkg;
                        const useLocation = packageWithLocation ? extractLocation(packageWithLocation) : location;
                        
                        const customerData = {
                            name: latestPkg.customerName || 'Tidak Diketahui',
                            phone: latestPkg.customerPhone || latestPkg.noHp || latestPkg.hp || '-',
                            address: latestPkg.address || latestPkg.alamat || latestPkg.lokasi || '-',
                            olshop: latestPkg.olshopName || latestPkg.olshop || '-',
                            kurir: String(latestPkg.kurirId || latestPkg.kurir || '-').split('@')[0],
                            packageId: latestPkg.packageId || latestPkg.resi || latestPkg.noResi || '-',
                            status: latestPkg.status || '-',
                            tanggal: latestPkg.dateString || latestPkg.tanggal || '-',
                            // Data koordinat
                            latitude: useLocation.lat,
                            longitude: useLocation.lng,
                            latSource: useLocation.latSource,
                            lngSource: useLocation.lngSource,
                            // ⭐ Field koordinat gabungan untuk debug & fallback
                            koordinatGps: latestPkg.koordinatGps || latestPkg.koordinat_gps || latestPkg.gps || latestPkg.titikLokasi || latestPkg.titik_lokasi || '',
                            // Info debug
                            hasLocation: anyPackageHasLocation,
                            totalFound: found.length,
                            allPackages: sorted,
                            // Coba ekstrak dari field lain jika alamat utama kosong
                            fullAddress: latestPkg.alamatLengkap || latestPkg.alamat_detail || latestPkg.address
                        };
                        
                        setLokasiSearchResult(customerData);
                        
                        if (anyPackageHasLocation && useLocation.lat !== null && useLocation.lng !== null) {
                            setLokasiSearchStatus('found');
                        } else {
                            setLokasiSearchStatus('empty');
                        }
                    }
                }, 600);
                } catch (e) {
                    console.error("Error di handleLokasiSearch:", e);
                    setLokasiSearchStatus('empty');
                    setLokasiSearchResult({
                        name: 'Error',
                        phone: '-',
                        address: 'Terjadi kesalahan saat pencarian: ' + e.message,
                        olshop: '-',
                        kurir: '-',
                        packageId: '-',
                        status: '-',
                        latitude: null,
                        longitude: null,
                        totalFound: 0,
                        allPackages: []
                    });
                }
            };

            // ⭐ INISIALISASI PETA - VERSI SUPER AMAN via window global
            useEffect(() => {
                try {
                    setMapInitialized(false);
                    setMapError(null);
                    
                    if (lokasiSearchStatus !== 'found' || !lokasiSearchResult) return;
                    
                    var lat = lokasiSearchResult.latitude;
                    var lng = lokasiSearchResult.longitude;
                    
                    if (lat === null || lng === null || lat === undefined || lng === undefined) return;
                    
                    lat = Number(lat);
                    lng = Number(lng);
                    
                    if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
                        setMapError("Koordinat tidak valid");
                        return;
                    }
                    
                    // Simpan data ke window global
                    try {
                        window.__lokasiData = {
                            lat: lat,
                            lng: lng,
                            name: lokasiSearchResult.name ? String(lokasiSearchResult.name) : '-',
                            phone: lokasiSearchResult.phone ? String(lokasiSearchResult.phone) : '-',
                            address: String(lokasiSearchResult.address || lokasiSearchResult.fullAddress || '-').substring(0, 80),
                            olshop: lokasiSearchResult.olshop ? String(lokasiSearchResult.olshop) : '-'
                        };
                    } catch(e) {
                        console.warn("Gagal set window.__lokasiData:", e);
                        return;
                    }
                    
                    // Panggil fungsi inisialisasi dengan delay
                    var timer = setTimeout(function() {
                        try {
                            if (typeof window.__initLokasiMap === 'function') {
                                window.__initLokasiMap();
                            }
                        } catch(e) {
                            console.error("Gagal panggil __initLokasiMap:", e);
                            setMapError("Gagal inisialisasi peta: " + e.message);
                        }
                    }, 300);
                    
                    return function() {
                        try {
                            clearTimeout(timer);
                            if (lokasiMapRef) {
                                try { lokasiMapRef.remove(); } catch(e) {}
                                setLokasiMapRef(null);
                            }
                            window.__lokasiData = null;
                        } catch(e) {}
                    };
                } catch (e) {
                    console.error("Error di useEffect peta:", e);
                    setMapError("Error sistem: " + e.message);
                }
            }, [lokasiSearchStatus, activeTab]);
            
            // Dengarkan event dari script global saat peta berhasil dimuat
            useEffect(() => {
                try {
                    function handleMapReady() {
                        try {
                            setMapInitialized(true);
                            setMapError(null);
                        } catch(e) {}
                    }
                    document.addEventListener('mapReady', handleMapReady);
                    return function() {
                        try {
                            document.removeEventListener('mapReady', handleMapReady);
                        } catch(e) {}
                    };
                } catch(e) {}
            }, []);

            // ⭐ FUNGSI RENDER LOKASI YANG TERISOLASI & AMAN
            // ⭐ FUNGSI RENDER LOKASI - VERSI AMAN & SEDERHANA
            const renderLokasiView = () => {
                try {
                    var R = lokasiSearchResult;
                    var S = lokasiSearchStatus;
                    var hasR = R && R !== null;
                    
                    // Ekstrak nilai aman
                    var name = hasR ? (R.name || '-') : '-';
                    var phone = hasR ? (R.phone || '-') : '-';
                    var address = hasR ? (R.address || R.fullAddress || '-') : '-';
                    var olshop = hasR ? (R.olshop || '-') : '-';
                    var kurir = hasR ? (R.kurir || '-') : '-';
                    var packageId = hasR ? (R.packageId || '-') : '-';
                    var totalFound = hasR ? (R.totalFound || 0) : 0;
                    var lat = hasR && R.latitude != null ? R.latitude : null;
                    var lng = hasR && R.longitude != null ? R.longitude : null;
                    var rawGps = hasR && R.koordinatGps ? String(R.koordinatGps) : '';
                    var allPkgs = hasR && R.allPackages ? R.allPackages : [];
                    var firstPkg = allPkgs.length > 0 ? allPkgs[0] : null;
                    
                    var latNum = lat != null ? Number(lat) : NaN;
                    var lngNum = lng != null ? Number(lng) : NaN;
                    var hasValidCoords = !isNaN(latNum) && !isNaN(lngNum) && latNum !== 0 && lngNum !== 0;
                    
                    var el = React.createElement;
                    var mainDivs = [];
                    
                    // === HEADER ===
                    mainDivs.push(el('div', {
                        style: { background: 'linear-gradient(135deg,#0891b2,#2563eb)', borderRadius: '16px', padding: '24px 28px', color: 'white', boxShadow: '0 10px 40px rgba(6,182,212,0.15)', border: '1px solid rgba(6,182,212,0.3)', marginBottom: '16px', position: 'relative', overflow: 'hidden' }
                    },
                        el('div', { style: { position: 'absolute', right: '-10px', bottom: '-20px', opacity: 0.15 } },
                            el('i', { className: 'fas fa-map-marked-alt', style: { fontSize: '120px' } })
                        ),
                        el('div', { style: { position: 'relative', zIndex: 1 } },
                            el('h3', { style: { fontWeight: 900, fontSize: '20px', margin: '0 0 8px 0', display: 'flex', alignItems: 'center', gap: '12px' } },
                                el('i', { className: 'fas fa-map-marker-alt', style: { color: '#67e8f9' } }),
                                'Cek Lokasi Customer'
                            ),
                            el('p', { style: { color: '#a5f3fc', fontSize: '13px', margin: 0, lineHeight: 1.5 } },
                                'Masukkan nomor HP customer untuk melihat informasi detail dan lokasi pada peta interaktif OpenStreetMap.'
                            )
                        )
                    ));
                    
                    // === SEARCH BOX ===
                    var searchInput = el('div', {
                        style: { background: '#1e2533', borderRadius: '16px', padding: '20px', border: '1px solid #2a3042', marginBottom: '16px' }
                    },
                        el('label', { style: { display: 'block', color: '#cbd5e1', fontSize: '13px', fontWeight: 700, marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px' } },
                            el('i', { className: 'fas fa-search', style: { color: '#06b6d4' } }),
                            'Cari Berdasarkan Nomor HP Customer'
                        ),
                        el('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap' } },
                            el('div', { style: { position: 'relative', flex: 1, minWidth: '240px' } },
                                el('i', { className: 'fas fa-mobile-alt', style: { position: 'absolute', left: '16px', top: '50%', transform: 'translateY(-50%)', color: '#64748b', fontSize: '16px' } }),
                                el('input', {
                                    type: 'tel',
                                    placeholder: 'Contoh: 081234567890',
                                    value: lokasiSearchPhone,
                                    onChange: function(e) { setLokasiSearchPhone(e.target.value); },
                                    onKeyPress: function(e) { if (e.key === 'Enter') handleLokasiSearch(); },
                                    style: { width: '100%', padding: '14px 16px 14px 48px', background: '#151928', border: '1px solid #2a3042', borderRadius: '12px', fontSize: '14px', outline: 'none', color: 'white', fontFamily: 'inherit', boxSizing: 'border-box' }
                                })
                            ),
                            el('button', {
                                onClick: handleLokasiSearch,
                                disabled: S === 'searching' || !lokasiSearchPhone.trim(),
                                style: {
                                    padding: '14px 28px',
                                    background: S === 'searching' || !lokasiSearchPhone.trim() ? '#475569' : '#06b6d4',
                                    color: 'white', border: 'none', borderRadius: '12px',
                                    fontWeight: 700, fontSize: '13px', cursor: S === 'searching' || !lokasiSearchPhone.trim() ? 'not-allowed' : 'pointer',
                                    display: 'flex', alignItems: 'center', gap: '8px', fontFamily: 'inherit'
                                }
                            }, S === 'searching' 
                                ? [el('i', { className: 'fas fa-circle-notch fa-spin' }), ' Mencari...']
                                : [el('i', { className: 'fas fa-location-arrow' }), ' Cek Lokasi']
                            ),
                            (lokasiSearchPhone || hasR) && el('button', {
                                onClick: function() {
                                    setLokasiSearchPhone('');
                                    setLokasiSearchResult(null);
                                    setLokasiSearchStatus('idle');
                                    setMapInitialized(false);
                                    setMapError(null);
                                    if (lokasiMapRef) { try { lokasiMapRef.remove(); } catch(e) {} setLokasiMapRef(null); }
                                    window.__lokasiData = null;
                                },
                                style: { padding: '14px 18px', background: '#151928', color: '#94a3b8', border: '1px solid #2a3042', borderRadius: '12px', cursor: 'pointer', fontFamily: 'inherit' }
                            }, el('i', { className: 'fas fa-times' }))
                        )
                    );
                    mainDivs.push(searchInput);
                    
                    // === KONDISI: IDLE ===
                    if (S === 'idle' && !hasR) {
                        mainDivs.push(el('div', {
