<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Kurir - Exceed Express</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#151928">
    <link rel="apple-touch-icon" href="Logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-dark': '#0b1120',
                        'app-card': '#1e2533',
                        'app-header': '#151928',
                        'app-border': '#2a3042'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

    <!-- PUSTAKA UNTUK EXPORT JPG & PDF (CETAK LAPORAN) -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { 
            touch-action: manipulation; 
            background-color: #0b1120; 
            font-family: 'Inter', system-ui, sans-serif; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a3042; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        .progress-bar-striped {
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }

        /* ========================================= */
        /* CSS KHUSUS UNTUK CETAK LAPORAN (PRINT)    */
        /* ========================================= */
        .excel-table { width: 100%; border-collapse: collapse; font-size: 11px; color: #000; }
        .excel-table th, .excel-table td { border: 1px solid #000; padding: 4px 6px; }
        .excel-table th { background-color: #f3f4f6; text-align: center; font-weight: bold; }
        .box-summary { border: 1px solid #000; font-size: 12px; font-weight: bold; background-color: #fff; color: #000;}
        .box-summary td { border: 1px solid #000; padding: 4px 8px; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background-color: #fff; }
            .no-print { display: none !important; }
            .cetak-container { background-color: #fff !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important;}
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        #export-loading {
            display: none; position: fixed; inset: 0; background: rgba(11, 17, 32, 0.95);
            z-index: 99999; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="antialiased text-slate-200 selection:bg-emerald-500 selection:text-white">
    
    <div id="export-loading">
        <i class="fas fa-circle-notch fa-spin text-4xl text-orange-500 mb-4"></i>
        <h2 class="text-xl font-bold text-white text-center px-4">Mempersiapkan Dokumen...</h2>
        <p class="text-slate-400 text-sm mt-2 text-center px-4">Harap tunggu, jangan tutup layar.<br/>Mengekstrak data ke format profesional.</p>
    </div>

    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, useRef, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Dashboard Crash:", error, errorInfo);
                this.setState({ errorInfo: error.toString() });
            }
            handleReset = () => {
                localStorage.clear();
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-app-dark flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                            <h1 className="text-2xl font-black text-white mb-2">Terjadi Kesalahan Sistem</h1>
                            <p className="text-slate-400 text-sm mb-6 max-w-md">Data di memori browser Anda mengalami kerusakan (corrupt). Silakan klik tombol di bawah untuk membersihkan memori dan memuat ulang aplikasi secara normal.</p>
                            <button onClick={this.handleReset} className="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center">
                                <i className="fas fa-sync-alt mr-2"></i> Bersihkan Memori & Muat Ulang
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const loadLocal = (key, fallback) => {
            try { 
                const item = localStorage.getItem(key); 
                return item ? JSON.parse(item) : fallback; 
            } catch (e) { 
                return fallback; 
            }
        };

        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };
        
        const formatCurrExcel = (amount) => {
            if (!amount && amount !== 0) return '-';
            if (amount === 0) return '0';
            return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(amount);
        };

        const StatusBadgeAdmin = ({ status }) => {
            const s = String(status || '').toLowerCase();
            if(s === 'sukses') return <span className="text-emerald-400 bg-emerald-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-emerald-800/50"><i className="fas fa-check-circle mr-1"></i>Sukses</span>;
            if(s === 'cancel' || s === 'batal') return <span className="text-red-400 bg-red-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-red-800/50"><i className="fas fa-times-circle mr-1"></i>Cancel</span>;
            if(s === 'pending') return <span className="text-orange-400 bg-orange-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-orange-800/50"><i className="fas fa-clock mr-1"></i>Pending</span>;
            return <span className="text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold uppercase border border-blue-800/50"><i className="fas fa-truck mr-1"></i>Proses</span>;
        };

        function DashboardApp() {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVHojspm17WSZU42RaMtgiNWJikRfGyTlPh1FczlDJS9JL52PxX0d9RpkNJYM4g424/exec"; 
            const APPSHEET_APP_ID = "APLIKASEXCEED-327461285";

            const [layoutMode, setLayoutMode] = useState(() => loadLocal('exceed_layout_mode', 'web'));
            const [isLoadingSync, setIsLoadingSync] = useState(false);
            
            const [packages, setPackages] = useState(() => loadLocal('exceed_master_packages', []));
            const [masterOlshops, setMasterOlshops] = useState([]);
            const [masterZonas, setMasterZonas] = useState([]);
            const [masterKurirs, setMasterKurirs] = useState([]);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [globalStatusFilter, setGlobalStatusFilter] = useState('semua');
            
            const [activeTab, setActiveTab] = useState('olshop'); 
            
            const [expandedOlshops, setExpandedOlshops] = useState([]); 
            const [olshopFilters, setOlshopFilters] = useState({}); 
            const [expandedKurirs, setExpandedKurirs] = useState([]); 
            const [kurirFilters, setKurirFilters] = useState({}); 

            const [selectedImage, setSelectedImage] = useState(null);

            // KONFIGURASI KALKULATOR BAGI HASIL (SKEMA)
            const [simSettings, setSimSettings] = useState(() => loadLocal('exceed_sim_settings', {
                paketPerHari: 68, rataOngkir: 12200, hariKerja: 26
            }));

            // PERSENTASE SKEMA SESUAI DENGAN KETENTUAN BARU
            const skemaPct = {
                kurir: 75,
                kas: 5,
                ops: 10,
                kantor: 2,
                owner: 8
            };

            const handleSimChange = (field, value) => {
                const numValue = value === '' ? '' : Number(value);
                setSimSettings(prev => ({ ...prev, [field]: numValue }));
            };

            // STATE UNTUK CETAK LAPORAN
            const printAreaRef = useRef(null);
            const [rekapMode, setRekapMode] = useState('olshop');
            const [selectedValue, setSelectedValue] = useState('');
            const [searchNameText, setSearchNameText] = useState('');
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [cetakSearchQuery, setCetakSearchQuery] = useState('');
            const [cetakStartDate, setCetakStartDate] = useState('');
            const [cetakEndDate, setCetakEndDate] = useState('');

            useEffect(() => { localStorage.setItem('exceed_layout_mode', JSON.stringify(layoutMode)); }, [layoutMode]);
            useEffect(() => { localStorage.setItem('exceed_master_packages', JSON.stringify(packages)); }, [packages]);
            useEffect(() => { localStorage.setItem('exceed_sim_settings', JSON.stringify(simSettings)); }, [simSettings]);

            const toggleOlshop = (name) => setExpandedOlshops(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const toggleKurir = (name) => setExpandedKurirs(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);

            const getFinancials = (pkg) => {
                if(!pkg) return { hBarang:0, tagihan:0, oDasar:0, oTambahan:0, oTotal:0 };
                const hBarang = Number(pkg.hargaPaket) || 0;
                const tagihan = Number(pkg.totalTagihan) || 0;
                const selisihTagihan = tagihan - hBarang > 0 ? tagihan - hBarang : 0;
                
                let oTambahan = Number(pkg.tambahanOngkir) || 0;
                let oDasar = Number(pkg.ongkirDasar) || 0;
                
                if (oTambahan === 0 && oDasar > 0 && selisihTagihan > oDasar) oTambahan = selisihTagihan - oDasar;
                else if (oTambahan === 0 && oDasar === 0 && selisihTagihan > 0) oDasar = selisihTagihan;
                if (oDasar === 0 && oTambahan > 0 && selisihTagihan > oTambahan) oDasar = selisihTagihan - oTambahan;

                return { hBarang, tagihan, oDasar: Math.max(0, oDasar), oTambahan, oTotal: Math.max(0, oDasar) + oTambahan };
            };

            const getFotoUrl = (pkg) => {
                if(!pkg) return null;
                const fileKey = pkg.fotoBukti || pkg.foto_bukti || pkg.foto || pkg.bukti || pkg.gambar;
                if (!fileKey || String(fileKey).trim() === '') return null;
                if (String(fileKey).startsWith('http://') || String(fileKey).startsWith('https://')) return fileKey;
                return `https://www.appsheet.com/template/gettablefileurl?appName=${APPSHEET_APP_ID}&tableName=InputPaket&fileName=${encodeURIComponent(fileKey)}`;
            };

            const syncData = async () => {
                setIsLoadingSync(true);
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getInitData&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setPackages(result.data.packages || []);
                        setMasterOlshops(result.data.olshop || []);
                        setMasterZonas(result.data.zona || []);
                        setMasterKurirs(result.data.kurir || []);
                    } else {
                        console.error('Gagal memuat data dari server.');
                    }
                } catch (error) {
                    console.error('Koneksi terputus. Cek internet Anda.');
                } finally {
                    setIsLoadingSync(false);
                }
            };

            useEffect(() => {
                syncData();
            }, []);

            // ==========================================
            // LOGIKA FILTER DAN AKUNTANSI GLOBAL
            // ==========================================
            const { filteredPkgs, olshopReport, kurirReport, globalSummary } = useMemo(() => {
                let pkgs = packages || [];
                
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    pkgs = pkgs.filter(p => String(p.customerName || '').toLowerCase().includes(q) || String(p.packageId || '').toLowerCase().includes(q) || String(p.olshopName || '').toLowerCase().includes(q) || String(p.kurirId || '').toLowerCase().includes(q));
                }
                
                if (startDate || endDate) {
                   pkgs = pkgs.filter(p => {
                      let pDateStr = p.dateString || p.tanggal || '';
                      if (!pDateStr) return false;
                      let normalizedDateStr = "";
                      try {
                          let d = new Date(pDateStr);
                          if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                              const parts = pDateStr.split('/');
                              if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                          }
                          if (!isNaN(d.getTime())) {
                              const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                              normalizedDateStr = `${year}-${month}-${day}`;
                          } else { normalizedDateStr = pDateStr.split('T')[0]; }
                      } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                      
                      const sDate = startDate ? startDate : "2000-01-01";
                      const eDate = endDate ? endDate : "2100-01-01";
                      return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                   });
                }
                
                let totalPkt = 0, totalSks = 0, totalPrs = 0, totalPnd = 0, totalCnc = 0;
                pkgs.forEach(p => {
                    if(!p) return;
                    totalPkt++;
                    let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                    if (stat === 'sukses') totalSks++;
                    else if (stat === 'cancel' || stat === 'batal') totalCnc++;
                    else if (stat === 'pending') totalPnd++;
                    else totalPrs++;
                });

                if (globalStatusFilter !== 'semua') {
                    pkgs = pkgs.filter(p => {
                        let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                        if (globalStatusFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                        if (globalStatusFilter === 'cancel') return stat === 'cancel' || stat === 'batal';
                        return stat === globalStatusFilter;
                    });
                }

                const oReport = {}; const kReport = {};
                const summary = { 
                    totalPencairanOlshop: 0, totalDanaBelumCair: 0, totalDanaCair: 0, 
                    totalSetoranKurir: 0, totalPaketSukses: 0, totalOngkirTambahanKurir: 0, 
                    totalProfitPerusahaan: 0, 
                    totalPkt, totalSks, totalPrs, totalPnd, totalCnc
                };

                pkgs.forEach(pkg => {
                    if(!pkg) return;
                    const statusPkg = String(pkg.status || '').toLowerCase().trim().replace(' ', '_');
                    const olshopName = String(pkg.olshopName || 'Tanpa Nama').toUpperCase();
                    const kurirName = String(pkg.kurirId || 'Tanpa Kurir').split('@')[0].toUpperCase();
                    const metode = String(pkg.metodeBayar || '').trim().toUpperCase();
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (!oReport[olshopName]) oReport[olshopName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, pencairan: 0, potongan: 0, potonganDasar: 0, potonganTambahan: 0, totalDasar: 0, totalTambahan: 0, nilaiBarang: 0, nominalBelumCair: 0, paketBelumCairIds: [], paketBelumCairDetails: [], paketTerkait: [] };
                    if (!kReport[kurirName]) kReport[kurirName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, setoran: 0, rincianCash: 0, rincianMinusTf: 0, totalTfOlshop: 0, totalTfKantor: 0, totalTambahanOngkir: 0, tambahanOngkirCash: 0, tambahanOngkirTF: 0, paketTerkait: [], totalDasarOngkir: 0, profitPerusahaan: 0 };
                    
                    oReport[olshopName].paketTerkait.push(pkg);
                    kReport[kurirName].paketTerkait.push(pkg);

                    if (statusPkg === 'sukses') {
                        oReport[olshopName].totalSukses += 1;
                        kReport[kurirName].totalSukses += 1;
                        summary.totalPaketSukses += 1;
                        summary.totalOngkirTambahanKurir += oTambahan; 
                        summary.totalProfitPerusahaan += oDasar; 
                        
                        oReport[olshopName].totalDasar += oDasar;
                        oReport[olshopName].totalTambahan += oTambahan;
                        
                        kReport[kurirName].totalTambahanOngkir += oTambahan;
                        kReport[kurirName].totalDasarOngkir += oDasar;
                        kReport[kurirName].profitPerusahaan += oDasar; 

                        const isCair = String(pkg.statusPencairan || '').toLowerCase() === 'cair';

                        let pencairan = 0; let potongan = 0;
                        if (metode === 'TF OLSHOP') { potongan = oTotal; oReport[olshopName].potonganDasar += oDasar; oReport[olshopName].potonganTambahan += oTambahan; pencairan = -oTotal; } 
                        else if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') { pencairan = hBarang; }

                        oReport[olshopName].pencairan += pencairan;
                        if (metode === 'TF OLSHOP') oReport[olshopName].potongan += oTotal;
                        if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') oReport[olshopName].nilaiBarang += hBarang;
                        summary.totalPencairanOlshop += pencairan;

                        if (!isCair) {
                            oReport[olshopName].nominalBelumCair += pencairan;
                            oReport[olshopName].paketBelumCairIds.push(pkg.packageId); 
                            oReport[olshopName].paketBelumCairDetails.push(pkg);
                            summary.totalDanaBelumCair += pencairan;
                        } else { summary.totalDanaCair += pencairan; }

                        let setoranKurir = 0;
                        if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') {
                            if (metode === 'TF OLSHOP') kReport[kurirName].totalTfOlshop += hBarang;
                            if (metode === 'TF KANTOR') kReport[kurirName].totalTfKantor += hBarang;
                            kReport[kurirName].rincianMinusTf += oTotal;
                            kReport[kurirName].tambahanOngkirTF += oTambahan; 
                            setoranKurir = -oTambahan; 
                        } else if (metode === 'CASH' || metode === 'COD') {
                            const cashDiterima = hBarang + oDasar + oTambahan; 
                            kReport[kurirName].rincianCash += cashDiterima;
                            kReport[kurirName].tambahanOngkirCash += oTambahan; 
                            setoranKurir = hBarang + oDasar; 
                        }
                        kReport[kurirName].setoran += setoranKurir;
                        summary.totalSetoranKurir += setoranKurir;

                    } else if (statusPkg === 'cancel' || statusPkg === 'batal') { oReport[olshopName].totalCancel += 1; kReport[kurirName].totalCancel += 1; } 
                    else if (statusPkg === 'pending') { oReport[olshopName].totalPending += 1; kReport[kurirName].totalPending += 1; } 
                    else { oReport[olshopName].totalProses += 1; kReport[kurirName].totalProses += 1; }
                });

                const activeOReport = Object.keys(oReport).filter(k => oReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = oReport[key]; return obj; }, {});
                const activeKReport = Object.keys(kReport).filter(k => kReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = kReport[key]; return obj; }, {});

                const sortedOlshop = Object.keys(activeOReport).map(k => ({ name: k, ...activeOReport[k] })).sort((a, b) => b.pencairan - a.pencairan);
                const sortedKurir = Object.keys(activeKReport).map(k => ({ name: k, ...activeKReport[k] })).sort((a, b) => b.setoran - a.setoran);

                return { filteredPkgs: pkgs, olshopReport: sortedOlshop, kurirReport: sortedKurir, globalSummary: summary };
            }, [packages, startDate, endDate, globalStatusFilter, searchQuery]);


            // ==========================================
            // LOGIKA CETAK LAPORAN
            // ==========================================
            const { cetakFilteredData, cetakSummary } = useMemo(() => {
                let filtered = packages;
                
                if (selectedValue) {
                    if (rekapMode === 'olshop') {
                        filtered = filtered.filter(p => String(p.olshopName).trim().toUpperCase() === selectedValue);
                    } else {
                        filtered = filtered.filter(p => String(p.kurirId || '').split('@')[0].trim().toUpperCase() === selectedValue);
                    }
                } else { filtered = []; }

                if (cetakSearchQuery) {
                    const q = cetakSearchQuery.toLowerCase();
                    filtered = filtered.filter(p => 
                        String(p.customerName).toLowerCase().includes(q) || 
                        String(p.packageId || '').toLowerCase().includes(q) ||
                        String(p.address || '').toLowerCase().includes(q)
                    );
                }

                if (cetakStartDate || cetakEndDate) {
                    filtered = filtered.filter(p => {
                        let pDateStr = p.dateString || p.tanggal || '';
                        if (!pDateStr) return false;
                        let normalizedDateStr = "";
                        try {
                            let d = new Date(pDateStr);
                            if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                                const parts = pDateStr.split('/');
                                if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                            }
                            if (!isNaN(d.getTime())) {
                                const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                                normalizedDateStr = `${year}-${month}-${day}`;
                            } else { normalizedDateStr = pDateStr.split('T')[0]; }
                        } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                        
                        const sDate = cetakStartDate ? cetakStartDate : "2000-01-01";
                        const eDate = cetakEndDate ? cetakEndDate : "2100-01-01";
                        return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                    });
                }

                let s_sukses = 0, s_pending = 0, s_cancel = 0;
                let setoran = 0, tfVolume = 0, sudahSetor = 0; 

                filtered.forEach(pkg => {
                    const stat = String(pkg.status).toLowerCase().replace(' ', '_');
                    const metode = String(pkg.metodeBayar).trim().toUpperCase();
                    const isCair = String(pkg.statusPencairan).toLowerCase() === 'cair';
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (stat === 'sukses') {
                        s_sukses++;
                        let currentSetoran = 0; let currentTfVolume = 0;
                        if (rekapMode === 'olshop') {
                            if (metode === 'CASH' || metode === 'COD' || metode === 'TF KANTOR') currentSetoran = hBarang;
                            if (metode === 'TF OLSHOP') currentTfVolume = oTotal;
                        } else {
                            if (metode === 'CASH' || metode === 'COD') currentSetoran = hBarang + oDasar;
                            if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') currentTfVolume = oTambahan;
                        }
                        setoran += currentSetoran;
                        tfVolume += currentTfVolume;
                        if (isCair) sudahSetor += (currentSetoran - currentTfVolume);
                    } else if (stat === 'pending' || stat === 'siap_antar' || stat === 'proses') { s_pending++; } 
                    else if (stat === 'cancel' || stat === 'batal') { s_cancel++; }
                });

                const estimasiSetoran = setoran - tfVolume;
                return { cetakFilteredData: filtered, cetakSummary: { sukses: s_sukses, pending: s_pending, cancel: s_cancel, setoran, tfVolume, estimasiSetoran, sudahSetor } };

                if(!dateStr) return '-';
                try {
                    const d = new Date(dateStr);
                    const months = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];

            };

                if (cetakStartDate && cetakEndDate) {
                    if (cetakStartDate === cetakEndDate) return getIndoDate(cetakStartDate);
                    return `${getIndoDate(cetakStartDate)} - ${getIndoDate(cetakEndDate)}`;
                } else if (cetakStartDate) return `Sejak ${getIndoDate(cetakStartDate)}`;

            const executeExport = async (format) => {

                const loadingEl = document.getElementById('export-loading');

                const currentScrollY = window.scrollY;
                window.scrollTo(0, 0);

                setTimeout(async () => {
                    try {
                        const element = printAreaRef.current;
                        const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: element.scrollWidth, windowHeight: element.scrollHeight });
                        window.scrollTo(0, currentScrollY);
                        const imgData = canvas.toDataURL('image/jpeg', 1.0);
                        const safeFileNameDate = (cetakStartDate === cetakEndDate && cetakStartDate) ? cetakStartDate : 'Rentang_Waktu';
                        const fileName = `Rekap_${rekapMode.toUpperCase()}_${selectedValue.replace(/\s+/g, '_')}_${safeFileNameDate}`;

                        if (format === 'jpg') {
                            const link = document.createElement('a'); link.href = imgData; link.download = `${fileName}.jpg`; link.click();
                        } else if (format === 'pdf') {
                            const { jsPDF } = window.jspdf;
                            const pdf = new jsPDF('l', 'mm', 'a4');
                            const pdfWidth = pdf.internal.pageSize.getWidth();
                            const pdfHeight = pdf.internal.pageSize.getHeight();
                            const imgWidth = pdfWidth - 20; 
                            const imgHeight = (canvas.height * imgWidth) / canvas.width; 
                            
                            let heightLeft = imgHeight; let position = 10; 
                            pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight);
                            heightLeft -= (pdfHeight - 20); 
                            
                            while (heightLeft > 0) {
                                position = position - pdfHeight; pdf.addPage();
                                pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight);
                                heightLeft -= pdfHeight;
                            }
                            pdf.save(`${fileName}.pdf`);
                        }

                    finally { loadingEl.style.display = 'none'; }

                                             <div className="flex flex-col">

                                                 <span className="text-blue-400 font-bold uppercase tracking-widest text-[10px] md:text-xs block mb-0.5">Total Pendapatan (Simulasi 1 Bulan)</span>

                                             <span className="text-xl md:text-2xl font-black text-white">{formatCurrency(simulasiPendapatanTotal)}</span>

                                        <div className="p-3 md:p-4 border-b border-app-border bg-app-header flex justify-between items-center">
                                            <h3 className="font-bold text-slate-200 text-xs md:text-sm flex items-center">
                                                <i className="fas fa-sitemap text-yellow-500 mr-2"></i> Skema Kalkulator Bagi Hasil
                                            </h3>
                                        </div>

                                            <div className="col-span-3 text-right text-blue-400">Simulasi 1 Bln</div>
                                            <div className="col-span-3 md:col-span-4 text-right text-emerald-400">Data Aktual (Sistem)</div>
                                        </div>
                                        
                                        {renderSchemaRow('Hak Kurir (Diluar Volum)', skemaPct.kurir, 'bg-blue-900/10 border-l-4 border-l-blue-500', '75% Dari Ongkir Dasar')}
                                        {renderSchemaRow('Kas Kurir', skemaPct.kas, 'bg-[#0b1120]', '5% Dari Ongkir Dasar')}
                                        {renderSchemaRow('Operasional (Ops)', skemaPct.ops, 'bg-[#0b1120]', '10% Dari Ongkir Dasar')}
                                        {renderSchemaRow('Kantor (PT)', skemaPct.kantor, 'bg-emerald-900/10 text-emerald-400', '2% Dari Ongkir Dasar')}
                                        {renderSchemaRow('Owner', skemaPct.owner, 'bg-emerald-900/10 text-emerald-400 border-l-4 border-emerald-500', '8% Dari Ongkir Dasar')}
                                        
                                        <div className="grid grid-cols-12 gap-2 p-3 bg-app-header border-t-2 border-emerald-600/50 items-center">
                                            <div className="col-span-5 md:col-span-4 font-black text-slate-200 text-[10px] md:text-sm uppercase">TOTAL</div>
                                            <div className="col-span-1 text-center font-black text-white text-[10px] md:text-sm">100%</div>
                                            <div className="col-span-3 text-right font-black text-white text-[10px] md:text-sm">{formatCurrency(simulasiPendapatanTotal)}</div>
                                            <div className="col-span-3 md:col-span-4 text-right font-black text-emerald-400 text-[10px] md:text-sm">{formatCurrency(aktualPendapatanTotal)}</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* VIEW RINCIAN PENDAPATAN */}
                        {activeTab === 'profit' && (
                            <div className="bg-app-card rounded-xl shadow-sm border border-app-border overflow-hidden">
                                <div className="p-3 md:p-4 border-b border-app-border bg-app-header flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="font-bold text-slate-200 text-xs md:text-sm flex items-center">
                                            <i className="fas fa-chart-line text-emerald-500 mr-2"></i> Rincian Pendapatan (Distribusi Ongkir Dasar)
                                        </h3>
                                        <p className="text-[10px] text-slate-400 mt-1">Alokasi otomatis 100% dari total Ongkir Dasar (Di luar Ongkir Tambahan/Volume).</p>
                                    </div>
                                    <div className="bg-[#0b1120] border border-app-border rounded-lg p-3 min-w-[140px] flex flex-col items-end shadow-inner">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Ongkir Dasar</span>
                                        <span className="text-white font-black text-sm md:text-lg">{formatCurrency(globalSummary.totalProfitPerusahaan)}</span>
                                    </div>
                                </div>
                                
                                <div className="overflow-x-auto custom-scrollbar">
                                    <div className={`${!isAndroid ? 'min-w-[1000px]' : 'w-full'} flex flex-col`}>

                                            <div className="p-8 text-center text-slate-500">Tidak ada data di periode ini.</div>
                                        ) : (
                                            !isAndroid ? (
                                                <div className="grid grid-cols-[200px_1fr_1fr_1fr_1fr_1fr_1fr] gap-3 px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border items-center">
                                                    <div>NAMA KURIR</div>
                                                    <div className="text-right text-slate-300">ONGKIR DSR TOTAL</div>
                                                    <div className="text-right text-blue-400">KURIR (75%)</div>
                                                    <div className="text-right text-yellow-400">KAS (5%)</div>
                                                    <div className="text-right text-orange-400">OPS (10%)</div>
                                                    <div className="text-right text-emerald-400">KANTOR (2%)</div>
                                                    <div className="text-right text-emerald-400">OWNER (8%)</div>
                                                </div>
                                            ) : (
                                                <div className="px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border">ALOKASI PENDAPATAN KURIR</div>
                                            )
                                        )}
                                        
                                        {[...kurirReport].sort((a,b) => b.totalDasarOngkir - a.totalDasarOngkir).map((kur, idx) => {
                                            const total = kur.totalDasarOngkir;
                                            const vKurir = (total * 75) / 100;
                                            const vKas = (total * 5) / 100;
                                            const vOps = (total * 10) / 100;
                                            const vPt = (total * 2) / 100;
                                            const vOwner = (total * 8) / 100;

                                            if (isAndroid) {
                                                return (
                                                    <div key={idx} className="flex flex-col gap-2 p-4 border-b border-app-border">
                                                        <div className="flex justify-between items-center"><span className="font-bold text-slate-200 uppercase text-xs"><i className="fas fa-motorcycle text-emerald-400 mr-2"></i>{kur.name}</span><span className="text-[10px] text-white font-bold">{formatCurrency(total)}</span></div>
                                                        <div className="grid grid-cols-2 gap-2 text-[10px] mt-1">
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-slate-400">Dsr Total:</span><span className="text-slate-300 font-bold">{formatCurrency(total)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-blue-400/80">Kurir(75%):</span><span className="text-blue-400 font-bold">{formatCurrency(vKurir)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-yellow-400/80">Kas(5%):</span><span className="text-yellow-400 font-bold">{formatCurrency(vKas)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-orange-400/80">Ops(10%):</span><span className="text-orange-400 font-bold">{formatCurrency(vOps)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-emerald-500/80">Kantor(2%):</span><span className="text-emerald-400 font-bold">{formatCurrency(vPt)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-emerald-500/80">Owner(8%):</span><span className="text-emerald-400 font-bold">{formatCurrency(vOwner)}</span></div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return (
                                                <div key={idx} className="grid grid-cols-[200px_1fr_1fr_1fr_1fr_1fr_1fr] gap-3 px-4 py-4 border-b border-app-border hover:bg-app-header transition-colors items-center">
                                                    <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-emerald-900/30 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0"><i className="fas fa-motorcycle"></i></div><span className="font-bold text-slate-200 uppercase truncate text-xs md:text-sm" title={kur.name}>{kur.name}</span></div>
                                                    <div className="text-right font-bold text-white">{formatCurrency(total)}</div>
                                                    <div className="text-right font-black text-blue-400">{formatCurrency(vKurir)}</div>
                                                    <div className="text-right font-black text-yellow-400">{formatCurrency(vKas)}</div>
                                                    <div className="text-right font-black text-orange-400">{formatCurrency(vOps)}</div>
                                                    <div className="text-right font-black text-emerald-400">{formatCurrency(vPt)}</div>
                                                    <div className="text-right font-black text-emerald-400">{formatCurrency(vOwner)}</div>
                                                </div>
                                            );
                                        })}
                                        {kurirReport.length > 0 && (
                                            !isAndroid ? (
                                                <div className="grid grid-cols-[200px_1fr_1fr_1fr_1fr_1fr_1fr] gap-3 px-4 py-4 border-t-2 border-emerald-600/50 bg-app-header rounded-b-xl items-center mt-1">
                                                    <div className="font-black text-slate-200 uppercase text-xs md:text-sm">TOTAL KESELURUHAN</div>
                                                    <div className="text-right font-black text-white">{formatCurrency(globalSummary.totalProfitPerusahaan)}</div>
                                                    <div className="text-right font-black text-blue-400">{formatCurrency((globalSummary.totalProfitPerusahaan * 75) / 100)}</div>
                                                    <div className="text-right font-black text-yellow-400">{formatCurrency((globalSummary.totalProfitPerusahaan * 5) / 100)}</div>
                                                    <div className="text-right font-black text-orange-400">{formatCurrency((globalSummary.totalProfitPerusahaan * 10) / 100)}</div>
                                                    <div className="text-right font-black text-emerald-400">{formatCurrency((globalSummary.totalProfitPerusahaan * 2) / 100)}</div>
                                                    <div className="text-right font-black text-emerald-400">{formatCurrency((globalSummary.totalProfitPerusahaan * 8) / 100)}</div>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col gap-2 p-4 border-t-2 border-emerald-600/50 bg-app-header rounded-b-xl mt-1">
                                                    <div className="font-black text-slate-200 uppercase text-xs mb-1">TOTAL KESELURUHAN</div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Ongkir Dsr:</span><span className="text-white font-bold">{formatCurrency(globalSummary.totalProfitPerusahaan)}</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Kurir (75%):</span><span className="text-blue-400 font-bold">{formatCurrency((globalSummary.totalProfitPerusahaan * 75) / 100)}</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Kas (5%):</span><span className="text-yellow-400 font-bold">{formatCurrency((globalSummary.totalProfitPerusahaan * 5) / 100)}</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Ops (10%):</span><span className="text-orange-400 font-bold">{formatCurrency((globalSummary.totalProfitPerusahaan * 10) / 100)}</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Kantor (2%):</span><span className="text-emerald-400 font-bold">{formatCurrency((globalSummary.totalProfitPerusahaan * 2) / 100)}</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Owner (8%):</span><span className="text-emerald-400 font-bold">{formatCurrency((globalSummary.totalProfitPerusahaan * 8) / 100)}</span></div>
                                                </div>
                                            )
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW OLSHOP */}
                        {activeTab === 'olshop' && (
                            <div className="bg-app-card rounded-xl shadow-sm border border-app-border overflow-hidden">
                                <div className="p-3 md:p-4 border-b border-app-border bg-app-header flex flex-col md:flex-row justify-between items-start md:items-center gap-2 md:gap-3">
                                    <h3 className="font-bold text-slate-200 text-xs md:text-sm w-full flex justify-between items-center">
                                        <span>Rekapitulasi Pencairan Olshop <span className="text-[10px] text-slate-400 font-normal ml-2 hidden md:inline">(Klik baris untuk rincian)</span></span>
                                    </h3>
                                    {isAndroid && (
                                        <div className="flex w-full justify-between items-center gap-3 mt-1">
                                            <button onClick={() => { setExpandedOlshops([]); window.scrollTo({top: 0, behavior: 'smooth'}); }} className="flex-1 flex justify-center items-center py-2 bg-[#1e2533] text-slate-300 rounded-xl text-xs font-bold border border-[#2a3042] shadow-sm transition-all active:bg-[#0b1120]">
                                                <i className="fas fa-arrow-left mr-2"></i> Kembali
                                            </button>
                                            <button onClick={() => syncData()} className="flex-1 flex justify-center items-center py-2 bg-[#1e7e59] text-white rounded-xl text-xs font-bold border border-emerald-700 shadow-sm transition-all active:bg-emerald-600">
                                                <i className={`fas fa-sync-alt mr-2 ${isLoadingSync ? 'animate-spin' : ''}`}></i> Refresh
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <div className={`${!isAndroid ? 'min-w-[1000px]' : 'w-full'} flex flex-col`}>
                                        {olshopReport.length === 0 ? (
                                            <div className="p-8 text-center text-slate-500">Tidak ada transaksi di periode/status ini.</div>
                                        ) : (
                                            olshopReport.map((ol, idx) => {
                                                const isExpanded = expandedOlshops.includes(ol.name);
                                                const currentFilter = olshopFilters[ol.name] || 'semua';
                                                const displayedPaket = ol.paketTerkait.filter(pkg => {
                                                    if (currentFilter === 'semua') return true;
                                                    let stat = String(pkg.status || '').toLowerCase().replace(' ', '_');
                                                    if (currentFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                                                    return stat === currentFilter;
                                                });
                                                
                                                return (
                                                    <div key={idx} className="flex flex-col border-b border-app-border hover:bg-app-header transition-colors">
                                                        <div className={`p-3 md:p-4 cursor-pointer flex ${isAndroid ? 'flex-col gap-3' : 'items-center justify-between'}`} onClick={() => toggleOlshop(ol.name)}>
                                                            <div className={`flex items-center gap-2.5 shrink-0 ${!isAndroid ? 'w-[280px]' : 'w-full justify-between'}`}>
                                                                <div className="flex items-center gap-2.5">
                                                                    <div className={`w-5 h-5 rounded flex items-center justify-center transition-transform ${isExpanded ? 'bg-[#d9531e] text-white rotate-180' : 'bg-app-border text-slate-400'}`}>
                                                                        <i className="fas fa-chevron-down text-[10px]"></i>
                                                                    </div>
                                                                    <i className="fas fa-store text-[#d9531e]"></i>
                                                                    <span className="font-bold text-slate-200 uppercase truncate text-xs md:text-sm max-w-[150px] md:max-w-[200px]">{ol.name}</span>
                                                                    <span className="text-[9px] bg-app-border text-slate-300 px-2 py-0.5 rounded shrink-0 font-bold">{ol.paketTerkait.length} Pkt</span>
                                                                </div>
                                                                {isAndroid && (
                                                                    <div className="min-w-[70px] flex justify-end" onClick={(e) => e.stopPropagation()}>
                                                                        {ol.paketBelumCairIds.length > 0 ? (
                                                                            <button disabled className="bg-app-border text-slate-400 px-3 py-1 rounded border border-[#374151] text-[9px] font-bold shadow-sm transition-colors flex items-center">
                                                                                Blm Cair ({ol.paketBelumCairIds.length})
                                                                            </button>
                                                                        ) : (
                                                                            <button disabled className="bg-emerald-900/30 text-emerald-500/50 px-3 py-1 rounded text-[9px] font-bold border border-emerald-900/50">LUNAS</button>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                            
                                                            <div className={`flex ${isAndroid ? 'grid grid-cols-2 gap-2 w-full mt-1' : 'flex-1 justify-end items-center gap-6'}`}>
                                                                <div className={`flex ${isAndroid ? 'justify-between items-center bg-[#0b1120] p-2 rounded border border-app-border' : 'flex-col items-end justify-center min-w-[70px]'}`}>
                                                                    <span className="text-[8px] font-bold text-emerald-500/70 uppercase tracking-widest mb-0.5">BARANG</span>
                                                                    <span className="text-xs md:text-sm font-black text-emerald-400">+{formatCurrency(ol.nilaiBarang)}</span>
                                                                </div>
                                                                <div className={`flex ${isAndroid ? 'justify-between items-center bg-[#0b1120] p-2 rounded border border-app-border' : 'flex-col items-end justify-center min-w-[70px]'}`}>
                                                                    <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">ONGKIR DSR</span>
                                                                    <span className="text-xs md:text-sm font-black text-slate-400">{formatCurrency(ol.totalDasar)}</span>
                                                                </div>
                                                                <div className={`flex ${isAndroid ? 'justify-between items-center bg-[#0b1120] p-2 rounded border border-app-border' : 'flex-col items-end justify-center min-w-[70px]'}`}>
                                                                    <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">ONGKIR TMB</span>
                                                                    <span className="text-xs md:text-sm font-black text-slate-400">{formatCurrency(ol.totalTambahan)}</span>
                                                                </div>
                                                                <div className={`flex ${isAndroid ? 'justify-between items-center bg-[#0b1120] p-2 rounded border border-app-border' : 'flex-col items-end justify-center min-w-[70px]'}`}>
                                                                    <span className="text-[8px] font-bold text-red-500/70 uppercase tracking-widest mb-0.5">POTONG TF</span>
                                                                    <span className="text-xs md:text-sm font-black text-red-400">-{formatCurrency(ol.potongan)}</span>
                                                                </div>
                                                                <div className={`flex ${isAndroid ? 'col-span-2 justify-between items-center bg-app-header p-2 rounded border border-app-border' : 'flex-col items-end justify-center min-w-[90px] pl-2 border-l border-app-border'}`}>
                                                                    <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">TOTAL BERSIH</span>
                                                                    <div className={`flex ${isAndroid ? 'items-center gap-2' : 'flex-col items-end'}`}>
                                                                        <span className={`text-[13px] md:text-[15px] font-black ${ol.pencairan >= 0 ? 'text-[#d9531e]' : 'text-red-500'}`}>{formatCurrency(ol.pencairan)}</span>
                                                                        {ol.nominalBelumCair !== ol.pencairan && ol.nominalBelumCair !== 0 && (
                                                                            <span className="text-[8px] text-slate-500 bg-black/30 px-1 py-0.5 rounded mt-0.5">Blm Cair: {formatCurrency(ol.nominalBelumCair)}</span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            {!isAndroid && (
                                                                <div className="min-w-[95px] flex justify-end ml-2" onClick={(e) => e.stopPropagation()}>
                                                                    {ol.paketBelumCairIds.length > 0 ? (
                                                                        <button disabled className="bg-app-border text-slate-400 px-3 py-1.5 rounded-lg text-[10px] font-bold shadow-sm w-full border border-[#374151]">
                                                                            Blm Cair ({ol.paketBelumCairIds.length})
                                                                        </button>
                                                                    ) : (
                                                                        <button disabled className="bg-emerald-900/30 text-emerald-500/50 px-3 py-1.5 rounded-lg text-[10px] font-bold w-full border border-emerald-900/50">LUNAS</button>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>

                                                        {isExpanded && (
                                                            <div className="p-3 md:p-4 bg-[#0b1120] border-t border-app-border">
                                                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-3 gap-3">
                                                                    <h4 className="text-slate-400 font-bold text-[10px] uppercase tracking-widest flex items-center"><i className="fas fa-boxes mr-2"></i>Rincian Resi: {ol.name}</h4>
                                                                    <div className="flex flex-wrap gap-1.5">
                                                                        {[{id:'semua', label:'Semua'}, {id:'sukses', label:'Sukses'}, {id:'proses', label:'Proses'}, {id:'pending', label:'Pending'}, {id:'cancel', label:'Cancel'}].map(f => (
                                                                            <button key={f.id} onClick={(e) => { e.stopPropagation(); setOlshopFilters(prev => ({...prev, [ol.name]: f.id})); }}
                                                                                className={`px-2.5 py-1 rounded text-[9px] font-bold uppercase transition-colors border ${currentFilter === f.id ? 'bg-[#d9531e] text-white border-[#d9531e]' : 'bg-app-card text-slate-400 border-app-border hover:bg-app-border'}`}>
                                                                                {f.label}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                                
                                                                {displayedPaket.length === 0 ? (
                                                                    <div className="text-center py-4 text-slate-500 text-xs italic">Tidak ada paket.</div>
                                                                ) : (
                                                                    isAndroid ? (
                                                                        <div className="flex flex-col gap-2">
                                                                            {displayedPaket.map((pkg, pIdx) => {
                                                                                const { hBarang, tagihan, oDasar, oTambahan } = getFinancials(pkg);

                                                        <th className="w-28">Status</th>
                                                        <th className="w-20">Metode Bayar</th>
                                                        <th className="w-28">{rekapMode === 'olshop' ? 'Kurir ID' : 'Nama Olshop'}</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {cetakFilteredData.length === 0 ? (
                                                        <tr><td colSpan="11" className="text-center py-8 text-gray-500 font-bold bg-gray-50">Tidak ada data paket untuk laporan ini.</td></tr>
                                                    ) : (
                                                        cetakFilteredData.map((pkg, idx) => {
                                                            const stat = String(pkg.status).toUpperCase();
                                                            const isPending = stat === 'PENDING' || stat === 'SIAP_ANTAR' || stat === 'PROSES';
                                                            const isCancel = stat === 'CANCEL' || stat === 'BATAL';
                                                            const { hBarang, tagihan, oDasar, oTambahan } = getFinancials(pkg);
                                                            const baseRowClass = isPending ? "bg-yellow-50" : (isCancel ? "bg-red-50" : "");

                                                            return (
                                                                <tr key={idx} className={baseRowClass}>
                                                                    <td className="text-center font-bold">{idx + 1}</td>
                                                                    <td className="font-semibold">{pkg.customerName}</td>
                                                                    <td className="text-center">{pkg.customerPhone || '-'}</td>
                                                                    <td>{pkg.address}</td>
                                                                    <td className="text-right">{hBarang === 0 ? '-' : formatCurrExcel(hBarang)}</td>
                                                                    <td className="text-right">{oDasar === 0 ? '-' : formatCurrExcel(oDasar)}</td>
                                                                    <td className="text-right">{oTambahan === 0 ? '-' : formatCurrExcel(oTambahan)}</td>
                                                                    <td className="text-right font-bold">{tagihan === 0 ? '-' : formatCurrExcel(tagihan)}</td>
                                                                    <td className={`text-center font-bold ${isPending ? 'text-yellow-700' : (isCancel ? 'text-red-600' : 'text-green-700')}`}>
                                                                        {stat === 'SIAP_ANTAR' || stat === 'PROSES' ? 'PENDING' : stat}
                                                                        {(isPending || isCancel) && (pkg.keterangan || pkg.keteranganStatus) && (
                                                                            <div className="text-[9px] font-normal text-gray-500 mt-0.5 leading-tight italic">
                                                                                {pkg.keterangan || pkg.keteranganStatus}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                    <td className="text-center">{pkg.metodeBayar || '-'}</td>
                                                                    <td className="text-[10px] uppercase font-bold text-center">
                                                                        {rekapMode === 'olshop' ? String(pkg.kurirId || '-').split('@')[0] : pkg.olshopName}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })
                                                    )}
                                                </tbody>
                                            </table>

                                            <div className="mt-8 text-center text-[11px] font-bold text-slate-600 border-t-2 border-slate-800 pt-3 flex flex-col items-center justify-center pb-2 shrink-0">
                                                <p className="text-sm text-slate-800">Exceed Express Logistics</p>
                                                <p className="font-medium mt-0.5 text-slate-500">Alamat Kantor : Jalan Garuda, BTN Bawah Jayapura, Papua.  No. HP 08215006669</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="h-screen bg-app-dark font-sans w-full mx-auto relative flex flex-col overflow-hidden">
                    {renderDashboardHeader()}

                    <div className="flex flex-1 overflow-hidden">
                        {!isAndroid && (
                            <div className="hidden lg:flex">
                                {renderWebSidebar()}
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-4 w-full h-full relative">
                            <div className={`mx-auto w-full space-y-4 md:space-y-5 pb-20 ${isAndroid ? 'max-w-xl' : 'max-w-7xl'}`}>
                                
                                {!isAndroid && activeTab !== 'cetak' && (
                                    <div className="lg:hidden flex overflow-x-auto space-x-2 border-b border-app-border pb-2 mb-2 scrollbar-hide">
                                        <button onClick={() => setActiveTab('olshop')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'olshop' ? 'bg-[#d9531e] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Olshop</button>
                                        <button onClick={() => setActiveTab('kurir')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'kurir' ? 'bg-[#3b82f6] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Kurir</button>
                                        <button onClick={() => setActiveTab('profit')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'profit' ? 'bg-[#10b981] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Rincian Pendapatan</button>
                                        <button onClick={() => setActiveTab('skema')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'skema' ? 'bg-[#eab308] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Kalkulator</button>
                                        <button onClick={() => setActiveTab('cetak')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'cetak' ? 'bg-orange-500 text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Cetak Laporan</button>
                                    </div>
                                )}

                                {activeTab !== 'cetak' && renderFilterSection()}
                                {activeTab !== 'cetak' && renderStatusSummaryBar()}
                                {activeTab !== 'cetak' && renderMetricCards()}
                                {isAndroid && activeTab !== 'cetak' && renderMenuGrid()}
                                {renderContent()}
                            </div>
                        </div>
                    </div>

                    {/* MODAL FOTO MEMBESAR */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-[99999] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 transition-opacity no-print" onClick={() => setSelectedImage(null)}>
                            <div className="relative w-full max-w-lg md:max-w-2xl flex flex-col items-center transform transition-all scale-100 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedImage(null)} className="absolute -top-12 right-0 text-white bg-red-500/80 hover:bg-red-500 w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-lg border border-white/20">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                                <img src={selectedImage} alt="Foto Paket" className="w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border-4 border-white/10 bg-black/50" />
                                <p className="text-white font-black mt-4 tracking-widest text-sm uppercase flex items-center bg-black/50 px-4 py-2 rounded-full border border-white/10">
                                    <i className="fas fa-camera mr-2 text-blue-400"></i> FOTO BUKTI
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const App = () => (
            <ErrorBoundary>
                <DashboardApp />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
