    <style>
        body { 
            touch-action: manipulation; 
            background-color: #0b1120; 
            font-family: 'Inter', system-ui, sans-serif; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a3042; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        .progress-bar-striped {
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");

            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }

        /* ========================================= */
        /* CSS KHUSUS UNTUK CETAK LAPORAN (PRINT)    */
        /* ========================================= */
        .excel-table { width: 100%; border-collapse: collapse; font-size: 11px; color: #000; }
        .excel-table th, .excel-table td { border: 1px solid #000; padding: 4px 6px; }
        .excel-table th { background-color: #f3f4f6; text-align: center; font-weight: bold; }
        .box-summary { border: 1px solid #000; font-size: 12px; font-weight: bold; background-color: #fff; color: #000;}
        .box-summary td { border: 1px solid #000; padding: 4px 8px; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background-color: #fff; }
            .no-print { display: none !important; }
            .cetak-container { background-color: #fff !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important;}
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        .leaflet-container {
            background: #1a2332;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
        }
        .leaflet-popup-content-wrapper {
            background: #1e2533;
            color: #f8fafc;
            border-radius: 10px;
            border: 1px solid #2a3042;
        }
        .leaflet-popup-tip {
            background: #1e2533;
        }
        .leaflet-popup-content {
            margin: 12px 16px;
            font-size: 12px;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.85) !important;
            color: #94a3b8 !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a {
            color: #60a5fa !important;
        }
        .leaflet-control-zoom a {
            background: #1e2533 !important;
            color: #f8fafc !important;
            border-color: #2a3042 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #2a3042 !important;
        }

        #export-loading {
            display: none; position: fixed; inset: 0; background: rgba(11, 17, 32, 0.95);
