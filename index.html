                                                <button onClick={() => executeExport('jpg')} disabled={!selectedValue || cetakFilteredData.length === 0} className={`px-2 md:px-3 py-1.5 text-xs font-bold rounded flex items-center ${!selectedValue || cetakFilteredData.length === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-700 text-blue-400'}`}><i className="fas fa-image md:mr-1.5"></i> <span className="hidden md:inline">JPG</span></button>
                                                <button onClick={() => executeExport('pdf')} disabled={!selectedValue || cetakFilteredData.length === 0} className={`px-2 md:px-3 py-1.5 text-xs font-bold rounded flex items-center border-l border-slate-700 ${!selectedValue || cetakFilteredData.length === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-700 text-red-400'}`}><i className="fas fa-file-pdf md:mr-1.5"></i> <span className="hidden md:inline">PDF</span></button>
                                                <button onClick={() => window.print()} disabled={!selectedValue || cetakFilteredData.length === 0} className={`px-3 md:px-4 py-1.5 text-xs font-bold rounded flex items-center border-l border-slate-700 ${!selectedValue || cetakFilteredData.length === 0 ? 'opacity-50 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}><i className="fas fa-print md:mr-1.5"></i> <span className="hidden md:inline">Print</span></button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col lg:flex-row flex-wrap gap-3 w-full bg-slate-900 p-3 rounded-lg border border-slate-700">
                                        <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-600 w-full lg:w-auto">
                                            <button onClick={() => { setRekapMode('olshop'); setSelectedValue(''); setSearchNameText(''); setIsDropdownOpen(false); }} className={`flex-1 px-4 py-2 text-xs font-bold rounded transition-colors ${rekapMode === 'olshop' ? 'bg-orange-500 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                                                <i className="fas fa-store mr-1.5"></i> Rekap Olshop
                                            </button>
                                            <button onClick={() => { setRekapMode('kurir'); setSelectedValue(''); setSearchNameText(''); setIsDropdownOpen(false); }} className={`flex-1 px-4 py-2 text-xs font-bold rounded transition-colors ${rekapMode === 'kurir' ? 'bg-orange-500 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                                                <i className="fas fa-motorcycle mr-1.5"></i> Rekap Kurir
                                            </button>
                                        </div>

                                        <div className="relative w-full lg:w-56 flex-1 z-[60]">
                                            <input 
                                                type="text" 
                                                placeholder={`Ketik / Pilih ${rekapMode === 'olshop' ? 'Olshop' : 'Kurir'}...`}
                                                value={searchNameText}
                                                onChange={(e) => {
                                                    setSearchNameText(e.target.value);
                                                    setIsDropdownOpen(true);
                                                    setSelectedValue('');
                                                }}
                                                onFocus={() => setIsDropdownOpen(true)}
                                                className="w-full pl-3 pr-8 py-2 bg-slate-700 border border-slate-600 rounded text-sm outline-none focus:border-orange-500 text-orange-300 font-bold placeholder-slate-400"
                                            />
                                            <i className={`fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 transition-transform pointer-events-none ${isDropdownOpen ? 'rotate-180' : ''}`}></i>
                                            
                                            {isDropdownOpen && (
                                                <React.Fragment>
                                                    <div className="fixed inset-0 z-40" onClick={() => setIsDropdownOpen(false)}></div>
                                                    <ul className="absolute z-50 w-full mt-1 bg-slate-700 border border-slate-600 rounded-md shadow-xl max-h-60 overflow-y-auto">
                                                        {(rekapMode === 'olshop' ? olshopListCetak : kurirListCetak)
                                                            .filter(opt => opt.toLowerCase().includes(searchNameText.toLowerCase()))
                                                            .map((opt, i) => (
                                                                <li 
                                                                    key={i} 
                                                                    onClick={() => {
                                                                        setSelectedValue(opt);
                                                                        setSearchNameText(opt);
                                                                        setIsDropdownOpen(false);
                                                                    }}
                                                                    className="px-3 py-2 text-sm text-slate-200 hover:bg-orange-500 hover:text-white cursor-pointer border-b border-slate-600 last:border-0"
                                                                >
                                                                    {opt}
                                                                </li>
                                                            ))
                                                        }
                                                        {(rekapMode === 'olshop' ? olshopListCetak : kurirListCetak).filter(opt => opt.toLowerCase().includes(searchNameText.toLowerCase())).length === 0 && (
                                                            <li className="px-3 py-2 text-sm text-slate-400 italic text-center">Nama tidak ditemukan</li>
                                                        )}
                                                    </ul>
                                                </React.Fragment>
                                            )}
                                        </div>

                                        <div className="relative w-full lg:w-48 flex-1">
                                            <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                            <input type="text" placeholder="Cari Resi / Nama..." value={cetakSearchQuery} onChange={(e) => setCetakSearchQuery(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm outline-none focus:border-orange-500 text-white" />
                                        </div>

                                        <div className="flex items-center gap-2 w-full lg:w-auto">
                                            <input type="date" value={cetakStartDate} onChange={(e) => setCetakStartDate(e.target.value)} className="bg-slate-700 border border-slate-600 rounded p-2 text-sm outline-none flex-1 text-slate-200" title="Tanggal Awal" />
                                            <span className="text-slate-400 text-xs font-bold">s/d</span>
                                            <input type="date" value={cetakEndDate} onChange={(e) => setCetakEndDate(e.target.value)} className="bg-slate-700 border border-slate-600 rounded p-2 text-sm outline-none flex-1 text-slate-200" title="Tanggal Akhir" />
                                            {(cetakStartDate || cetakEndDate) && (<button onClick={() => { setCetakStartDate(''); setCetakEndDate(''); }} className="bg-red-500/20 text-red-400 p-2 rounded hover:bg-red-500/40"><i className="fas fa-times"></i></button>)}
                                        </div>
                                    </div>
                                </div>

                                {!selectedValue ? (
                                    <div className="no-print text-center text-slate-500 flex-1 flex flex-col items-center justify-center p-8">
                                        <i className={`fas ${rekapMode === 'olshop' ? 'fa-store' : 'fa-motorcycle'} text-6xl mb-4 text-slate-300`}></i>
                                        <h2 className="text-xl font-bold text-slate-700 mb-2">Area Cetak Laporan</h2>
                                        <p className="text-sm">Silakan pilih <b>Nama {rekapMode === 'olshop' ? 'Olshop' : 'Kurir'}</b> di panel atas untuk memuat data rekap yang siap dicetak.</p>
                                    </div>
                                ) : (
                                    <div className="flex-1 overflow-auto bg-gray-200 p-2 md:p-8 flex justify-center">
                                        <div ref={printAreaRef} className="cetak-container bg-white w-[1150px] min-w-[1150px] p-6 shadow-xl border border-gray-300 flex flex-col mx-auto my-0">
                                            <div className="flex justify-between items-start mb-6 gap-6">
                                                <div className="flex items-center gap-4">
                                                    <div className="flex flex-col items-center">
                                                        <div className="w-[120px] shrink-0 border border-slate-200 rounded p-1 bg-slate-50 flex items-center justify-center">
                                                            <img src="https://drive.google.com/uc?id=1xBkWoexBfNOe8WKhDp8WBkh7hjvK4Yub" crossOrigin="anonymous" alt="Exceed Logo" className="w-full h-auto object-contain" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} />
                                                            <div style={{display: 'none'}} className="w-full h-[50px] bg-[#0f172a] flex-col justify-center items-center text-white italic rounded-sm">
                                                                <span className="text-xl font-black text-orange-500">e<span className="text-blue-300">X</span></span>
                                                            </div>
                                                        </div>
                                                        <span className="text-[10px] font-bold italic text-slate-700 mt-1.5 whitespace-nowrap">"Antar tuntas harga pas"</span>
                                                    </div>

                                                    <div className="flex flex-col gap-1">
                                                        <div className="border border-black px-4 py-1.5 font-bold text-sm min-w-[250px] uppercase bg-gray-50 flex items-center">
                                                            <span className="text-[10px] text-gray-500 mr-2 border-r border-gray-400 pr-2">{rekapMode === 'olshop' ? 'OLSHOP' : 'KURIR'}</span>
                                                            {selectedValue}
                                                        </div>
                                                        <div className="border border-black px-4 py-1.5 text-sm font-semibold min-w-[250px]">
                                                            {displayHeaderDate()}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex gap-4">
                                                    <table className="box-summary w-[260px]">
                                                        <tbody>
                                                            <tr>
                                                                <td className="bg-gray-100">{rekapMode === 'olshop' ? 'Setoran' : 'Setoran (Fisik Cash)'}</td>
                                                                <td className="text-right">{formatCurrExcel(cetakSummary.setoran)}</td>
                                                            </tr>
                                                            <tr>
                                                                <td className="bg-gray-100">{rekapMode === 'olshop' ? 'TF/VOLUME' : 'Minus Hak (TF/Vol)'}</td>
                                                                <td className="text-right text-red-600">{formatCurrExcel(cetakSummary.tfVolume)}</td>
                                                            </tr>
                                                            <tr>
                                                                <td className="bg-gray-100">{rekapMode === 'olshop' ? 'Estimasi Setoran' : 'Total Wajib Setor'}</td>
                                                                <td className="text-right text-blue-600">{formatCurrExcel(cetakSummary.estimasiSetoran)}</td>
                                                            </tr>
                                                            <tr>
                                                                <td className="bg-gray-100">SUDAH SETOR</td>
                                                                <td className="text-right text-emerald-600">{formatCurrExcel(cetakSummary.sudahSetor)}</td>
                                                            </tr>
                                                        </tbody>
                                                    </table>

                                                    <table className="box-summary w-[120px]">
                                                        <tbody>
                                                            <tr><td className="bg-green-400 text-green-900 uppercase tracking-wider">SUKSES</td><td className="text-center font-black text-lg w-[40px]">{cetakSummary.sukses}</td></tr>
                                                            <tr><td className="bg-yellow-400 text-yellow-900 uppercase tracking-wider">PENDING</td><td className="text-center font-black text-lg">{cetakSummary.pending}</td></tr>
                                                            <tr><td className="bg-red-500 text-white uppercase tracking-wider">CANCEL</td><td className="text-center font-black text-lg">{cetakSummary.cancel}</td></tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            <table className="excel-table flex-1">
                                                <thead>
                                                    <tr>
                                                        <th className="w-8">NO</th>
                                                        <th className="w-32">Nama Customer</th>
                                                        <th className="w-24">No HP Customer</th>
                                                        <th className="w-48">Alamat Lengkap</th>
                                                        <th className="w-20">Harga Paket</th>
                                                        <th className="w-20">Ongkir Dasar</th>
                                                        <th className="w-20">Tambahan Ongkir</th>
                                                        <th className="w-20">Total Tagihan</th>
                                                        <th className="w-28">Status</th>
                                                        <th className="w-20">Metode Bayar</th>
                                                        <th className="w-28">{rekapMode === 'olshop' ? 'Kurir ID' : 'Nama Olshop'}</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {cetakFilteredData.length === 0 ? (
                                                        <tr><td colSpan="11" className="text-center py-8 text-gray-500 font-bold bg-gray-50">Tidak ada data paket untuk laporan ini.</td></tr>
                                                    ) : (
                                                        cetakFilteredData.map((pkg, idx) => {
                                                            const stat = String(pkg.status).toUpperCase();
                                                            const isPending = stat === 'PENDING' || stat === 'SIAP_ANTAR' || stat === 'PROSES';
                                                            const isCancel = stat === 'CANCEL' || stat === 'BATAL';
                                                            const { hBarang, tagihan, oDasar, oTambahan } = getFinancials(pkg);
                                                            const baseRowClass = isPending ? "bg-yellow-50" : (isCancel ? "bg-red-50" : "");

                                                            return (
                                                                <tr key={idx} className={baseRowClass}>
                                                                    <td className="text-center font-bold">{idx + 1}</td>
                                                                    <td className="font-semibold">{pkg.customerName}</td>
                                                                    <td className="text-center">{pkg.customerPhone || '-'}</td>
                                                                    <td>{pkg.address}</td>
                                                                    <td className="text-right">{hBarang === 0 ? '-' : formatCurrExcel(hBarang)}</td>
                                                                    <td className="text-right">{oDasar === 0 ? '-' : formatCurrExcel(oDasar)}</td>
                                                                    <td className="text-right">{oTambahan === 0 ? '-' : formatCurrExcel(oTambahan)}</td>
                                                                    <td className="text-right font-bold">{tagihan === 0 ? '-' : formatCurrExcel(tagihan)}</td>
                                                                    <td className={`text-center font-bold ${isPending ? 'text-yellow-700' : (isCancel ? 'text-red-600' : 'text-green-700')}`}>
                                                                        {stat === 'SIAP_ANTAR' || stat === 'PROSES' ? 'PENDING' : stat}
                                                                        {(isPending || isCancel) && (pkg.keterangan || pkg.keteranganStatus) && (
                                                                            <div className="text-[9px] font-normal text-gray-500 mt-0.5 leading-tight italic">
                                                                                {pkg.keterangan || pkg.keteranganStatus}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                    <td className="text-center">{pkg.metodeBayar || '-'}</td>
                                                                    <td className="text-[10px] uppercase font-bold text-center">
                                                                        {rekapMode === 'olshop' ? String(pkg.kurirId || '-').split('@')[0] : pkg.olshopName}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })
                                                    )}
                                                </tbody>
                                            </table>

                                            <div className="mt-8 text-center text-[11px] font-bold text-slate-600 border-t-2 border-slate-800 pt-3 flex flex-col items-center justify-center pb-2 shrink-0">
                                                <p className="text-sm text-slate-800">Exceed Express Logistics</p>
                                                <p className="font-medium mt-0.5 text-slate-500">Alamat Kantor : Jalan Garuda, BTN Bawah Jayapura, Papua.  No. HP 08215006669</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="h-screen bg-app-dark font-sans w-full mx-auto relative flex flex-col overflow-hidden">
                    {renderDashboardHeader()}

                    <div className="flex flex-1 overflow-hidden">
                        {!isAndroid && (
                            <div className="hidden lg:flex">
                                {renderWebSidebar()}
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-4 w-full h-full relative">
                            <div className={`mx-auto w-full space-y-4 md:space-y-5 pb-20 ${isAndroid ? 'max-w-xl' : 'max-w-7xl'}`}>
                                
                                {!isAndroid && activeTab !== 'cetak' && (
                                    <div className="lg:hidden flex overflow-x-auto space-x-2 border-b border-app-border pb-2 mb-2 scrollbar-hide">
                                        <button onClick={() => setActiveTab('olshop')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'olshop' ? 'bg-[#d9531e] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Olshop</button>
                                        <button onClick={() => setActiveTab('kurir')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'kurir' ? 'bg-[#3b82f6] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Kurir</button>
                                        <button onClick={() => setActiveTab('profit')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'profit' ? 'bg-[#10b981] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Rincian Pendapatan</button>
                                        <button onClick={() => setActiveTab('skema')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'skema' ? 'bg-[#eab308] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Kalkulator</button>
                                        <button onClick={() => setActiveTab('cetak')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'cetak' ? 'bg-orange-500 text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Cetak Laporan</button>
                                        <button onClick={() => setActiveTab('lokasi')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'lokasi' ? 'bg-cyan-500 text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Cek Lokasi</button>
                                    </div>
                                )}

                                {activeTab !== 'cetak' && renderFilterSection()}
                                {activeTab !== 'cetak' && renderStatusSummaryBar()}
                                {activeTab !== 'cetak' && renderMetricCards()}
                                {isAndroid && activeTab !== 'cetak' && renderMenuGrid()}
                                {renderContent()}
                            </div>
                        </div>
                    </div>

                    {/* MODAL FOTO MEMBESAR */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-[99999] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 transition-opacity no-print" onClick={() => setSelectedImage(null)}>
                            <div className="relative w-full max-w-lg md:max-w-2xl flex flex-col items-center transform transition-all scale-100 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedImage(null)} className="absolute -top-12 right-0 text-white bg-red-500/80 hover:bg-red-500 w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-lg border border-white/20">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                                <img src={selectedImage} alt="Foto Paket" className="w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border-4 border-white/10 bg-black/50" />
                                <p className="text-white font-black mt-4 tracking-widest text-sm uppercase flex items-center bg-black/50 px-4 py-2 rounded-full border border-white/10">
                                    <i className="fas fa-camera mr-2 text-blue-400"></i> FOTO BUKTI
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const App = () => (
            <ErrorBoundary>
                <DashboardApp />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
